<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KSMS 블록세상 v4(메타버스)</title>
    <link rel="icon" type="image/x-icon" href="./icon.ico?v=4">
    <!-- Tailwind CSS 및 FontAwesome 로드 (libs 폴더 로컬 파일 — 오프라인 구동 지원) -->
    <script src="./libs/tailwind.js"></script>
    <link rel="stylesheet" href="./libs/fontawesome/css/all.min.css">
    <!-- Three.js 및 OrbitControls 로드 (로컬) -->
    <script src="./libs/three.min.js"></script>
    <script src="./libs/OrbitControls.js"></script>
    <!-- 싱글플레이: 서버 없음 — socket.io 로드하지 않음 (가상 모드로 로컬 실행) -->
    <style>
        @import url('./libs/fonts/noto-sans-kr.css');
        
        html, body {
            height: 100%;
            height: -webkit-fill-available;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
        }
        #game-container {
            width: 100%;
            height: 100%;
            height: -webkit-fill-available;
        }
        
        body {
            font-family: 'Noto Sans KR', 'Noto Sans KR Latin', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        /* 단축바 슬롯 액티브 하이라이트 효과 */
        /* 🌟 iPad 더블탭 확대 차단: 상단바는 manipulation(더블탭 줌만 제거, 슬라이더 드래그 유지) */
        #top-bar, #top-bar * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .hotbar-slot {
            transition: all 0.15s ease;
        }
        .hotbar-slot.active {
            border-color: #ffffff !important;
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            z-index: 10;
        }
        /* 크롬 조절 슬라이더 커스텀 */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f43f5e;
            cursor: pointer;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', '"Noto Sans KR Latin"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="text-white overflow-hidden w-full fixed">

<!-- 피격 오버레이 빨간색 화면 (투명도 30% 셀로판지 효과) -->
<div id="damage-flash" class="fixed inset-0 pointer-events-none opacity-0 z-40" style="background-color: rgba(255, 0, 0, 0.3); transition: opacity 0.075s;"></div>

<!-- 🌟 미디어블록 팝업 (쫀지 설정 + 일반 열람, 게임 디자인 적용) -->
<div id="media-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 px-4">
    <div id="media-shell" class="bg-[#111111] border-[6px] border-[#466d2e] rounded-2xl w-max max-w-[90vw] shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
        <div id="media-kind-row" class="hidden px-4 pt-3 flex-shrink-0">
            <div class="grid grid-cols-3 gap-1 bg-[#2b471b] p-1 rounded-lg text-sm font-bold">
                <button id="media-kind-video" class="py-1.5 rounded-md transition-all">동영상</button>
                <button id="media-kind-image" class="py-1.5 rounded-md transition-all">이미지</button>
                <button id="media-kind-web" class="py-1.5 rounded-md transition-all">웹페이지</button>
            </div>
        </div>
        <div id="media-editor-row" class="hidden px-4 pt-3 gap-2 flex-shrink-0">
            <input id="media-url-input" type="text" inputmode="url" placeholder="유튜브·드라이브 영상 또는 이미지 링크 붙여넣기"
                   class="flex-1 min-w-0 bg-[#3d6328] border-4 border-[#2b471b] rounded-lg px-3 py-2 text-white text-sm font-bold focus:outline-none focus:border-yellow-400 placeholder-white/50">
            <button id="media-apply" class="flex-shrink-0 bg-[#fcd34d] hover:bg-[#fbbf24] text-orange-700 font-extrabold text-sm px-4 rounded-lg border-b-4 border-[#d97706] active:border-b-0 active:translate-y-0.5 transition-all">적용하기</button>
        </div>
        <div id="media-content" class="p-4 overflow-hidden min-h-0"></div>
        <div id="media-bottom-bar" class="flex gap-2 px-4 pb-4 flex-shrink-0">
            <button id="media-unlink" class="hidden flex-1 bg-red-700 hover:bg-red-600 text-white font-bold text-sm py-2 rounded-lg border-b-4 border-red-900 active:border-b-0 active:translate-y-0.5 transition-all">연결 해제</button>
        </div>
    </div>
</div>

<!-- 🌟 토스트 알림창 (하단 중앙) -->
<div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 z-50 bg-black/80 text-white text-sm font-bold px-4 py-2 rounded-lg transition-opacity duration-200 opacity-0 pointer-events-none">알림</div>

<!-- 첫 화면: 게임 시작 대기 및 캐릭터명 설정 모달 -->
<div id="setup-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#8bcbf9] px-4">
    <div class="bg-[#59893d] border-[6px] border-[#466d2e] p-8 pb-4 rounded-2xl max-w-md w-full text-center shadow-2xl relative">
        <div class="flex justify-start mb-7 gap-3 items-center">
            <!-- 🌟 새 게임 아이콘 (icon.png) -->
            <img src="./icon.png?v=4" width="55" height="55" class="border-4 border-[#2b471b]" style="border-radius: 18%;" alt="KSMS 아이콘">
            <h1 class="text-2xl md:text-[34px] font-black tracking-wider text-yellow-300" style="-webkit-text-stroke: 8px #2b471b; paint-order: stroke fill;"><span style="color: #ffffff;">KSMS</span> 블록세상 <span style="color: #59893d;">v4</span></h1>
        </div>
        
        <div class="mb-4 relative">
            <div id="outfit-picker" class="grid grid-cols-6 gap-2">
                <!-- 🌟 JS가 무지개 순서(빨·주·노·초·파·보)로 6종 의상 버튼을 주입 -->
            </div>
        </div>

        <div class="mb-6 relative">
            <div class="grid grid-cols-3 gap-2">
                <input type="text" id="accesscode-input" placeholder="접속번호" maxlength="4" inputmode="numeric" autocomplete="off" autofocus
                       class="bg-[#3d6328] border-4 border-[#2b471b] rounded-lg px-2 py-3 text-white text-lg font-bold text-center focus:outline-none focus:border-yellow-400 placeholder-white/60 transition-all shadow-inner">
                <input type="text" id="username-input" placeholder="이름을 적어주세요" maxlength="12"
                       class="col-span-2 bg-[#3d6328] border-4 border-[#2b471b] rounded-lg px-4 py-3 text-white text-lg font-bold text-center focus:outline-none focus:border-yellow-400 placeholder-white/60 transition-all shadow-inner">
            </div>
            <p id="error-msg" class="text-rose-200 text-xs font-bold mt-2 hidden"><i class="fa-solid fa-triangle-exclamation mr-1"></i>이름은 한글·영문·숫자만 입력해 주세요!</p>
            <p id="code-error-msg" class="text-rose-200 text-xs font-bold mt-2 hidden"><i class="fa-solid fa-triangle-exclamation mr-1"></i>접속번호가 틀렸습니다. 다시 입력해 주세요!</p>
        </div>
        
        <button id="start-btn" 
                class="w-full bg-[#fcd34d] hover:bg-[#fbbf24] active:bg-[#f59e0b] text-orange-600 font-extrabold text-xl py-3.5 rounded-lg border-b-4 border-[#d97706] shadow-md active:border-b-0 active:translate-y-1 transition-all" style="border: 4px solid #92400e; border-bottom: 4px solid #d97706;">
            블록세상 들어가기
        </button>
        <p class="text-center text-[11px] text-white/70 font-bold mt-4">© 2026 KSMS. All rights reserved.</p>
    </div>
</div>

<div id="game-container" class="relative hidden">
    <!-- 상단 붉은 핏빛 테마 제어 탑 바 -->
    <div id="top-bar" class="absolute top-0 left-0 right-0 h-12 bg-[#210508]/90 border-b border-rose-900/40 flex items-center justify-between px-4 z-40 backdrop-blur-sm">
        
        <!-- 왼쪽 영역: 타이틀 및 뷰 줌 슬라이더 -->
        <div class="flex items-center gap-4 flex-shrink-0">
            <div class="text-white font-black tracking-wider text-sm flex items-center gap-2">
                <img src="./icon.ico?v=4" width="22" height="22" class="rounded-sm flex-shrink-0" style="image-rendering: pixelated;" alt="KSMS 아이콘">
                <span class="text-white font-black tracking-wider text-xs sm:text-sm whitespace-nowrap">KSMS 블록세상 v4</span>
            </div>

            <!-- 화질 조절 (저/중/고): 클릭할 때마다 고 → 중 → 저 순서로 전환 -->
            <button id="quality-btn" class="h-8 px-2 rounded bg-rose-950/40 hover:bg-rose-900/60 flex items-center justify-center gap-1 border border-rose-900/30 text-rose-200 transition-colors shadow-md pointer-events-auto" title="화질 조절: 클릭할 때마다 저 → 중 → 고 순서로 전환">
                <i id="quality-icon" class="fa-solid fa-gauge-high text-sm"></i>
                <span id="quality-label" class="text-xs font-bold">고</span>
            </button>

            <!-- 카메라 줌 슬라이더 조절 기어 -->
            <div class="flex items-center gap-1.5 bg-rose-950/40 border border-rose-900/30 rounded-full px-3 py-1 pointer-events-auto text-rose-300">
                <i class="fa-solid fa-minus text-xs" title="축소"></i>
                <input id="zoom-slider" type="range" min="4" max="15" step="0.1" value="9.5" class="w-16 sm:w-28 accent-rose-500 bg-rose-950 h-1 rounded-lg appearance-none cursor-pointer">
                <i class="fa-solid fa-plus text-xs" title="확대"></i>
            </div>
        </div>
        
        <!-- 중앙 영역: 1인칭/3인칭 시점 전환 버튼 + 투명인간 버튼 (쫀지 전용) -->
        <div class="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center gap-2">
            <button id="view-toggle-btn" class="w-8 h-8 rounded bg-rose-950/40 hover:bg-rose-900/60 flex items-center justify-center border border-rose-900/30 text-rose-200 transition-colors shadow-md pointer-events-auto" title="1인칭/3인칭 시점 전환">
                <i id="view-toggle-icon" class="fa-solid fa-eye text-sm"></i>
            </button>
            <button id="ghost-toggle-btn" class="hidden w-8 h-8 rounded bg-rose-950/40 hover:bg-rose-900/60 flex items-center justify-center border border-rose-900/30 text-rose-200 transition-colors shadow-md pointer-events-auto" title="투명인간 모드 (블록 통과)">
                <i id="ghost-toggle-icon" class="fa-solid fa-ghost text-sm"></i>
            </button>
            <button id="summon-all-btn" class="hidden w-8 h-8 rounded bg-rose-950/40 hover:bg-rose-900/60 flex items-center justify-center border border-rose-900/30 text-rose-200 transition-colors shadow-md pointer-events-auto" title="전체 소환 (모든 접속자를 내 위치로)">
                <i class="fa-solid fa-magnet text-sm"></i>
            </button>
            <button id="freeze-all-btn" class="hidden w-8 h-8 rounded bg-rose-950/40 hover:bg-rose-900/60 flex items-center justify-center border border-rose-900/30 text-rose-200 transition-colors shadow-md pointer-events-auto" title="전체 동결 (모든 접속자 조종 불가)">
                <i class="fa-solid fa-snowflake text-sm"></i>
            </button>
        </div>

        <!-- 오른쪽 영역: 유틸리티 기능 제어부 -->
        <div class="flex items-center gap-2 flex-shrink-0">
            <input type="file" id="file-input" class="hidden" accept=".블록세상,.ksms">
            
            <!-- 쫀지모드 전용 4가지 실행옵션 컨트롤바 -->
            <div id="admin-mode-controls" class="hidden items-center gap-1.5 flex-shrink-0 bg-rose-950/40 p-1 rounded-lg border border-rose-900/30 mr-2">
                <button class="admin-mode-btn w-7 h-7 rounded flex items-center justify-center pointer-events-auto transition-all" data-mode="ATTACK" title="공격 모드 (PvP, 블록, 중력)"><i class="fa-solid fa-skull text-xs"></i></button>
                <button class="admin-mode-btn w-7 h-7 rounded flex items-center justify-center pointer-events-auto transition-all" data-mode="SAFE" title="안전 모드 (관전 모드)"><i class="fa-solid fa-shield-halved text-xs"></i></button>
                <button class="admin-mode-btn w-7 h-7 rounded flex items-center justify-center pointer-events-auto transition-all" data-mode="GRAVITY" title="중력 모드 (블록 설치, 중력)"><i class="fa-solid fa-cube text-xs"></i></button>
                <button class="admin-mode-btn w-7 h-7 rounded flex items-center justify-center pointer-events-auto transition-all" data-mode="FLIGHT" title="비행 모드 (자유 비행, 블록 설치)"><i class="fa-solid fa-dove text-xs"></i></button>
            </div>

            <button id="save-btn" class="w-8 h-8 rounded bg-rose-950/40 hover:bg-rose-900/60 hidden items-center justify-center border border-rose-900/30 text-rose-200 transition-colors pointer-events-auto shadow-md" title="블록 저장">
                <i class="fa-solid fa-download text-sm"></i>
            </button>
            <button id="load-btn" class="w-8 h-8 rounded bg-rose-950/40 hover:bg-rose-900/60 hidden items-center justify-center border border-rose-900/30 text-rose-200 transition-colors pointer-events-auto shadow-md" title="블록 로드">
                <i class="fa-solid fa-folder-open text-sm"></i>
            </button>
            <button id="capture-btn" class="w-8 h-8 rounded bg-rose-950/40 hover:bg-rose-900/60 flex items-center justify-center border border-rose-900/30 text-rose-200 transition-colors shadow-md pointer-events-auto" title="화면 캡처">
                <i class="fa-solid fa-camera text-sm"></i>
            </button>
            <button id="photo-btn" class="w-8 h-8 rounded bg-rose-950/40 hover:bg-rose-900/60 flex items-center justify-center border border-rose-900/30 text-rose-200 transition-colors shadow-md pointer-events-auto" title="새 창에서 이미지 열기">
                <i class="fa-solid fa-image text-sm"></i>
            </button>
            <button id="fullscreen-btn" class="w-8 h-8 rounded bg-rose-950/40 hover:bg-rose-900/60 flex items-center justify-center border border-rose-900/30 text-rose-200 transition-colors shadow-md pointer-events-auto" title="전체화면">
                <i class="fa-solid fa-expand text-sm"></i>
            </button>
        </div>
    </div>

    <!-- WebGL Canvas -->
    <canvas id="game-canvas" class="absolute inset-0 w-full h-full block"></canvas>

    <!-- 좌하단 모바일 전용 방향 가상 조이스틱 -->
    <div class="absolute bottom-[33%] left-12 z-20 pointer-events-auto block touch-none">
        <div id="mobile-joystick" class="w-32 h-32 bg-slate-850/40 border-4 border-slate-600/60 rounded-xl relative flex items-center justify-center backdrop-blur-xs shadow-xl">
            <div class="absolute w-12 h-12 bg-slate-500/30 border border-slate-400/40 rounded-md"></div>
            <div id="joystick-knob" class="w-14 h-14 bg-slate-300/65 border-2 border-white/80 rounded-lg absolute transition-all duration-75 shadow-lg flex items-center justify-center">
                <div class="w-6 h-6 bg-slate-500/80 rounded-xs"></div>
            </div>
        </div>
    </div>

    <!-- 우하단 모바일 점프 & 기어가기 컨트롤 허브 -->
    <div class="absolute bottom-[33%] right-12 z-20 flex flex-col gap-3.5 items-center touch-none pointer-events-auto">
        <button id="mobile-jump-btn" class="w-16 h-16 bg-slate-850/40 border-4 border-slate-600/60 rounded-xl flex items-center justify-center shadow-lg active:scale-90 transition-all select-none" title="점프">
            <i class="fa-solid fa-arrow-up text-xl text-white/80"></i>
        </button>
        <button id="mobile-crouch-btn" class="w-16 h-16 bg-slate-850/40 border-4 border-slate-600/60 rounded-xl flex items-center justify-center shadow-lg active:scale-90 transition-all select-none" title="기어가기">
            <i class="fa-solid fa-arrow-down text-xl text-white/80"></i>
        </button>
    </div>

    <!-- 하단 블록 단축바 영역 -->
    <div id="hotbar-wrapper" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-30 w-[95%] max-w-3xl px-2 hidden">
        <div id="hotbar-container" class="bg-slate-850/40 border-4 border-slate-600/60 rounded-xl p-1.5 flex items-center gap-1 shadow-2xl backdrop-blur-xs overflow-hidden pointer-events-auto">
            <!-- 11가지 색의 블록 슬롯 + 지우개 슬롯 -->
            <button class="hotbar-slot flex-1 min-w-0 aspect-square rounded-lg border-2 border-slate-600/40 bg-slate-800/10 flex items-center justify-center active:scale-95" data-index="0" data-type="block" data-value="#FF0000" title="빨간색 블록">
                <span class="w-[72%] h-[72%] rounded shadow-inner" style="background-color: #FF0000;"></span>
            </button>
            <button class="hotbar-slot flex-1 min-w-0 aspect-square rounded-lg border-2 border-slate-600/40 bg-slate-800/10 flex items-center justify-center active:scale-95" data-index="1" data-type="block" data-value="#FFA500" title="오렌지색 블록">
                <span class="w-[72%] h-[72%] rounded shadow-inner" style="background-color: #FFA500;"></span>
            </button>
            <button class="hotbar-slot flex-1 min-w-0 aspect-square rounded-lg border-2 border-slate-600/40 bg-slate-800/10 flex items-center justify-center active:scale-95" data-index="2" data-type="block" data-value="#FFFF00" title="노란색 블록">
                <span class="w-[72%] h-[72%] rounded shadow-inner" style="background-color: #FFFF00;"></span>
            </button>
            <button class="hotbar-slot flex-1 min-w-0 aspect-square rounded-lg border-2 border-slate-600/40 bg-slate-800/10 flex items-center justify-center active:scale-95" data-index="3" data-type="block" data-value="#008000" title="초록색 블록">
                <span class="w-[72%] h-[72%] rounded shadow-inner" style="background-color: #008000;"></span>
            </button>
            <button class="hotbar-slot flex-1 min-w-0 aspect-square rounded-lg border-2 border-slate-600/40 bg-slate-800/10 flex items-center justify-center active:scale-95" data-index="4" data-type="block" data-value="#0000FF" title="파란색 블록">
                <span class="w-[72%] h-[72%] rounded shadow-inner" style="background-color: #0000FF;"></span>
            </button>
            <button class="hotbar-slot flex-1 min-w-0 aspect-square rounded-lg border-2 border-slate-600/40 bg-slate-800/10 flex items-center justify-center active:scale-95" data-index="5" data-type="block" data-value="#800080" title="보라색 블록">
                <span class="w-[72%] h-[72%] rounded shadow-inner" style="background-color: #800080;"></span>
            </button>
            <button class="hotbar-slot flex-1 min-w-0 aspect-square rounded-lg border-2 border-slate-600/40 bg-slate-800/10 flex items-center justify-center active:scale-95" data-index="6" data-type="block" data-value="#8B4512" title="갈색 블록">
                <span class="w-[72%] h-[72%] rounded shadow-inner" style="background-color: #8B4512;"></span>
            </button>
            <button class="hotbar-slot flex-1 min-w-0 aspect-square rounded-lg border-2 border-slate-600/40 bg-slate-800/10 flex items-center justify-center active:scale-95" data-index="7" data-type="block" data-value="#FFFFFF" title="흰색 블록">
                <span class="w-[72%] h-[72%] rounded shadow-inner border border-slate-300" style="background-color: #FFFFFF;"></span>
            </button>
            <button class="hotbar-slot flex-1 min-w-0 aspect-square rounded-lg border-2 border-slate-600/40 bg-slate-800/10 flex items-center justify-center active:scale-95" data-index="8" data-type="block" data-value="#808080" title="회색 블록">
                <span class="w-[72%] h-[72%] rounded shadow-inner" style="background-color: #808080;"></span>
            </button>
            <button class="hotbar-slot flex-1 min-w-0 aspect-square rounded-lg border-2 border-slate-600/40 bg-slate-800/10 flex items-center justify-center active:scale-95" data-index="9" data-type="block" data-value="#222222" title="검정색 블록">
                <span class="w-[72%] h-[72%] rounded shadow-inner" style="background-color: #222222;"></span>
            </button>
            <!-- 큐브블록 (쫀지모드 전용 설치, 밟으면 접속자 전원 퇴장) -->
            <button class="hotbar-slot flex-1 min-w-0 aspect-square rounded-lg border-2 border-slate-600/40 bg-slate-800/10 flex items-center justify-center active:scale-95" data-index="10" data-type="block" data-value="#FFC0CB" title="큐브블록">
                <span class="w-[72%] h-[72%] rounded shadow-inner border border-slate-400/70 overflow-hidden">
                    <svg class="w-full h-full block" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

// 주의: 안티앨리어싱은 렌더러 생성 시점에 결정되므로 기기 기본값을 따름

const QUALITY_LABELS = { LOW: '저', MID: '중', HIGH: '고' };
const QUALITY_ICONS = { LOW: 'fa-gauge-simple', MID: 'fa-gauge', HIGH: 'fa-gauge-high' };

function qualityPixelRatio(q) {
    const cap = (q === 'HIGH') ? 2 : (q === 'MID' ? 1.5 : 1.0);
    return Math.min(window.devicePixelRatio || 1, cap);
}

// 🌟 [C안 ①] 화질별 시야 거리(카메라 far)·안개 농도 — 저화질일수록 좁고 짙게 하여 GPU 부하 절감
function qualityViewDistance(q) {
    return (q === 'HIGH') ? 200 : (q === 'MID' ? 130 : 85);
}
function qualityFogDensity(q) {
    return (q === 'HIGH') ? 0.012 : (q === 'MID' ? 0.016 : 0.024);
}

function applyQuality(q) {
    currentQuality = q;
    try { localStorage.setItem('ksms-quality', q); } catch (e) {}

        camera.far = qualityViewDistance(q);

    if (sunLight) {
        const shadowsOn = (q === 'HIGH');

        });
    }
    const qIcon = document.getElementById('quality-icon');
    const qLabel = document.getElementById('quality-label');
    if (qIcon && qLabel) {
        qIcon.className = `fa-solid ${QUALITY_ICONS[q]} text-sm`;
        qLabel.innerText = QUALITY_LABELS[q];
    }
}

class SoundEffects {
    constructor() { this.ctx = null; }
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    playPlace() {
        this.init(); if (!this.ctx) return;
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.type = 'triangle'; osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.start(); osc.stop(this.ctx.currentTime + 0.15);
    }
    playBreak() {
        this.init(); if (!this.ctx) return;
        let bufferSize = this.ctx.sampleRate * 0.1;
        let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        let noise = this.ctx.createBufferSource(); noise.buffer = buffer;
        let filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 180;
        let gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
        noise.start(); noise.stop(this.ctx.currentTime + 0.1);
    }
    playHit() {
        this.init(); if (!this.ctx) return;
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.type = 'triangle'; 
        osc.frequency.setValueAtTime(160, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(15, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.start(); osc.stop(this.ctx.currentTime + 0.12);
    }
    playCelebration() {
        this.init(); if (!this.ctx) return;
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, index) => {
            setTimeout(() => {
                let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.start(); osc.stop(this.ctx.currentTime + 0.4);
            }, index * 100);
        });
    }
}

// 링크 → {kind, url(임베드용)} 변환. 지원 불가면 null
function parseMediaUrl(raw) {
    if (!raw) return null;
    let u = String(raw).trim();
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    let host = '', pathq = '';
    try {
        const p = new URL(u);
        if (p.protocol !== 'http:' && p.protocol !== 'https:') return null;
        host = p.hostname.toLowerCase();
        pathq = p.pathname + p.search;
    } catch (e) { return null; }
    if (host.indexOf('.') < 0) return null;
    let m;
    // 유튜브: watch / embed / shorts / live / youtu.be → 임베드 주소
    if (host.indexOf('youtube.com') >= 0 || host === 'youtu.be' || host === 'm.youtube.com') {
        m = u.match(/(?:youtube\.com\/(?:watch\?[^#]*v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{6,})/i);
        if (m) return { kind: 'youtube', url: 'https://www.youtube.com/embed/' + m[1] };
        return null;
    }
    // 구글 드라이브 영상: 공유 링크 → 미리보기 주소
    m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/i) || u.match(/drive\.google\.com\/open\?[^#]*\bid=([\w-]+)/i);
    if (m) return { kind: 'video', url: 'https://drive.google.com/file/d/' + m[1] + '/preview' };
    // 구글 드라이브 이미지: 썸네일 주소로 변환
    m = u.match(/drive\.google\.com\/uc\?[^#]*\bid=([\w-]+)/i);
    if (m) return { kind: 'image', url: 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600' };
    // 직접 동영상 / 이미지 파일
    if (/\.(mp4|webm|ogg|mov)(\?|#|$)/i.test(pathq)) return { kind: 'video', url: u };
    if (/\.(jpe?g|png|gif|webp|bmp|svg)(\?|#|$)/i.test(pathq)) return { kind: 'image', url: u };
    return null;
}

function isSafeMediaInfo(info) {
    if (!info || typeof info !== 'object') return false;
    if (info.kind === 'text') return typeof info.text === 'string' && info.text.length > 0 && info.text.length <= 500;
    return (info.kind === 'youtube' || info.kind === 'video' || info.kind === 'image' || info.kind === 'web')
        && typeof info.url === 'string' && /^https?:\/\//i.test(info.url) && info.url.length <= 2000;
}

// 🌟 미디어 정제 복사 (동기화·저장 시 텍스트 필드 보존, 변조 필드 제거)
function cleanMediaInfo(info) {
    if (!info || typeof info !== 'object') return null;
    if (info.kind === 'text') {
        if (typeof info.text !== 'string' || !info.text.length || info.text.length > 500) return null;
        return { kind: 'text', text: info.text };
    }
    if ((info.kind === 'youtube' || info.kind === 'video' || info.kind === 'image' || info.kind === 'web')
        && typeof info.url === 'string' && /^https?:\/\//i.test(info.url) && info.url.length <= 2000) {
        return { url: info.url, kind: info.kind };
    }
    return null;
}

// 링크 + 직접 선택한 종류 → {kind, url} 변환. 불가면 {error} 또는 null
function normalizeMediaByKind(raw, pick) {
    if (!raw) return null;
    let u = String(raw).trim();
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    let host = '', pathq = '';
    try {
        const p = new URL(u);
        if (p.protocol !== 'http:' && p.protocol !== 'https:') return null;
        host = p.hostname.toLowerCase();
        pathq = p.pathname + p.search;
    } catch (e) { return null; }
    if (host.indexOf('.') < 0) return null;
    const isYtHost = host.indexOf('youtube.com') >= 0 || host === 'youtu.be' || host === 'm.youtube.com';
    const yt = u.match(/(?:youtube\.com\/(?:watch\?[^#]*v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{6,})/i);
    const driveFile = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/i) || u.match(/drive\.google\.com\/open\?[^#]*\bid=([\w-]+)/i);
    const driveUc = u.match(/drive\.google\.com\/uc\?[^#]*\bid=([\w-]+)/i);
    const isImgExt = /\.(jpe?g|png|gif|webp|bmp|svg)(\?|#|$)/i.test(pathq);
    const isVidExt = /\.(mp4|webm|ogg|mov)(\?|#|$)/i.test(pathq);
    if (pick === 'web') {
        // 🌟 웹페이지는 주소 그대로 (단, 유튜브는 임베드로 바꿔야 표시됨)
        if (isYtHost) {
            if (yt) return { kind: 'youtube', url: 'https://www.youtube.com/embed/' + yt[1] };
            return null;
        }
        return { kind: 'web', url: u };
    }
    if (pick === 'image') {
        if (isYtHost) return { error: 'yt' };
        if (driveUc) return { kind: 'image', url: 'https://drive.google.com/thumbnail?id=' + driveUc[1] + '&sz=w1600' };
        if (driveFile) return { kind: 'image', url: 'https://drive.google.com/thumbnail?id=' + driveFile[1] + '&sz=w1600' };
        if (isImgExt) return { kind: 'image', url: u };
        return null;
    }
    if (isYtHost) {
        if (yt) return { kind: 'youtube', url: 'https://www.youtube.com/embed/' + yt[1] };
        return null;
    }
    if (driveFile) return { kind: 'video', url: 'https://drive.google.com/file/d/' + driveFile[1] + '/preview' };
    if (driveUc) return { kind: 'video', url: 'https://drive.google.com/file/d/' + driveUc[1] + '/preview' };
    if (isVidExt) return { kind: 'video', url: u };
    if (isImgExt) return { error: 'img' };
    return null;
}

const MEDIA_BORDER_COLORS = { youtube: '#e53935', video: '#e53935', image: '#1e88e5', web: '#fdd835', text: '#00e676' };
function setMediaBorder(kind) {
    const shell = document.getElementById('media-shell');
    if (!shell) return;
    shell.style.borderColor = MEDIA_BORDER_COLORS[kind] || '#466d2e';
}

function setMediaContent(info) {
    const box = document.getElementById('media-content');
    if (!box) return;
    box.innerHTML = '';
    if (!isSafeMediaInfo(info)) {
        const p = document.createElement('p');
        p.className = 'text-white/80 text-sm font-bold text-center py-8';
        p.textContent = '등록된 내용이 없습니다.';
        box.appendChild(p);
        return;
    }
    setMediaBorder(info.kind);
    // 🌟 크롬 여백: 편집 모드(입력행 있음) 200, 열람 모드 100
    const edRow = document.getElementById('media-editor-row');
    const chromeH = (edRow && !edRow.classList.contains('hidden')) ? 200 : 100;
    const maxBoxW = () => window.innerWidth * 0.9 - 100;
    const maxBoxH = () => window.innerHeight * 0.9 - chromeH;
    function fitMediaBox(el, iw, ih) {
        if (!iw || !ih) return;
        const s = Math.min(maxBoxW() / iw, maxBoxH() / ih);
        el.style.width = Math.max(1, Math.floor(iw * s)) + 'px';
        el.style.height = Math.max(1, Math.floor(ih * s)) + 'px';
    }
    if (info.kind === 'text') {
        // 🌟 텍스트 열람: 60% 박스 + 박스에 맞게 글씨 자동 축소 (textContent만 사용 — XSS 불가)
        const div = document.createElement('div');
        div.textContent = info.text;
        div.style.cssText = 'width:60vw;height:60vh;overflow-y:auto;white-space:pre-wrap;word-break:break-word;color:#fff;font-weight:800;line-height:1.5;border-radius:8px;background:#22331c;padding:24px;margin:0 auto;font-size:100px;';
        box.appendChild(div);
        let fs = 100, guard = 0;
        while (div.scrollHeight > div.clientHeight && fs > 14 && guard++ < 50) {
            fs -= 2;
            div.style.fontSize = fs + 'px';
        }
        return;
    }
    if (info.kind === 'image') {
        const img = document.createElement('img');
        img.src = info.url;
        img.alt = '미디어블록 이미지';
        img.referrerPolicy = 'no-referrer';
        img.style.cssText = 'object-fit:contain;border-radius:8px;background:#000;display:block;margin:0 auto;';
        img.onload = () => fitMediaBox(img, img.naturalWidth, img.naturalHeight);
        box.appendChild(img);
    } else if (info.kind === 'youtube' || /drive\.google\.com/i.test(info.url)) {
        const fr = document.createElement('iframe');
        fr.src = info.url;
        fr.title = '미디어블록 영상';
        fr.allowFullscreen = true;
        fr.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation');
        fr.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
        // 🌟 동영상 팝업은 모두 16:9 고정 맞춤 (유튜브·드라이브)
        fr.style.cssText = 'aspect-ratio:16/9;border:0;border-radius:8px;background:#000;display:block;';
        fr.style.width = Math.floor(Math.min(maxBoxW(), maxBoxH() * 16 / 9)) + 'px';
        box.appendChild(fr);
    } else if (info.kind === 'web') {
        const fr = document.createElement('iframe');
        fr.src = info.url;
        fr.title = '미디어블록 영상';
        fr.allowFullscreen = true;
        fr.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation');
        fr.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
        // 🌟 웹페이지는 최대 박스
        fr.style.cssText = 'border:0;border-radius:8px;background:#000;display:block;';
        fr.style.width = Math.floor(maxBoxW()) + 'px';
        fr.style.height = Math.floor(maxBoxH()) + 'px';
        box.appendChild(fr);
    } else {
        const v = document.createElement('video');
        v.src = info.url;
        v.controls = true;
        v.playsInline = true;
        v.preload = 'metadata';
        v.style.cssText = 'object-fit:contain;border-radius:8px;background:#000;display:block;margin:0 auto;';
        // 🌟 직접 동영상 파일도 16:9 고정 맞춤
        v.onloadedmetadata = () => {
            const w = Math.min(maxBoxW(), maxBoxH() * 16 / 9);
            v.style.width = Math.floor(w) + 'px';
            v.style.height = Math.floor(w * 9 / 16) + 'px';
        };
        box.appendChild(v);
    }
}

function openMediaEditor(idx) {
    currentMediaIdx = idx;

    input.value = (info && info.url) ? info.url : '';
    if (info && info.kind === 'image') {
        currentMediaKindPick = 'image';

        currentMediaKindPick = 'web';

    const input = document.getElementById('media-url-input');

    if (!parsed || parsed.error) {
        const code = parsed && parsed.error;
        showToast(code === 'yt' ? '유튜브 주소는 동영상으로 선택하세요'
            : code === 'img' ? '이미지 파일은 이미지로 선택하세요'
            : '지원하지 않는 링크입니다 (유튜브·드라이브·이미지)');
        return;
    }
    mediaInfo[currentMediaIdx] = parsed; // 낙관적 반영 (서버 방송으로 확정)
    socket.emit('media-set', { index: currentMediaIdx, url: parsed.url, kind: parsed.kind });

const tmpMediaEye = new THREE.Vector3(), tmpMediaTarget = new THREE.Vector3(), tmpMediaDir = new THREE.Vector3(), tmpMediaMat = new THREE.Matrix4();
// 🌟 미디어블록 터치 우선 처리 — true면 handleInteract 나머지 흐름 생략
//    쫀지: 미디어 도구로 터치 → 설정 / 지우개·다른 도구 → 기존 흐름
//    일반: 지우개 → 불가 토스트 / 안전모드+5칸+시야 통과 → 열람
function tryMediaTouch() {
    raycaster.setFromCamera(mouse, camera);
    const targets = [floorMesh];
    for (let c = 1; c <= 11; c++) { if (instancedMeshes[c]) targets.push(instancedMeshes[c]); }
    if (cubeBlockGroup) targets.push(cubeBlockGroup);
    if (mediaBlockGroup) targets.push(mediaBlockGroup);
    const hits = raycaster.intersectObjects(targets, true);
    if (!hits.length) return false;
    const hit = hits[0];
    // 🌟 미디어블록(개별 메시)은 userData.worldIdx로 칸 역추적 (큐브블록과 동일 방식)
    if (!(mediaBlockGroup && hit.object.parent === mediaBlockGroup)) return false;
    const idx = hit.object.userData.worldIdx;
    if (idx === undefined || worldData[idx] !== 12) return false;
    tmpMediaTarget.copy(hit.object.position);

    if (isEasterEgg) {
        if (selectedToolType === 'eraser') return false; // 삭제 흐름 + 링크 정리
        if (activeHotbarIndex === 11) { openMediaEditor(idx); return true; } // 미디어 도구 → 설정
        return false; // 다른 블록 도구 → 인접 칸 설치 흐름
    }
    if (selectedToolType === 'eraser') { showToast('미디어블록은 삭제할 수 없습니다!'); return true; }
    if (globalMode !== 'SAFE' || freezeAll) return false; // 안전모드에서만 열람 (좀비 포함)
    const eyeY = charPhysics.position.y + (charPhysics.isCrawling ? 0.5 : 1.5);
    tmpMediaEye.set(charPhysics.position.x, eyeY, charPhysics.position.z);
    const dist = tmpMediaEye.distanceTo(tmpMediaTarget);
    if (dist > 5.0) { showToast('5칸 이내에서 터치하세요'); return true; }
    tmpMediaDir.subVectors(tmpMediaTarget, tmpMediaEye).normalize();
    const prevFar = raycaster.far;
    raycaster.set(tmpMediaEye, tmpMediaDir);
    // 🌟 목표 미디어블록 자신의 메시는 히트 단위로 제외 (그룹째로 담겨 있어 targets 필터로는 걸러지지 않음)
    //    공격 판정과 동일하게 far = dist - 0.3 (목표 몸체 제외)
    raycaster.far = Math.max(0.1, dist - 0.3);
    const blocked = raycaster.intersectObjects(targets, true).some(h => h.object !== hit.object);
    raycaster.far = prevFar;
    if (blocked) { showToast('벽에 가려져 있어 볼 수 없습니다'); return true; }
    openMediaViewer(idx);
    return true;
}

function getIndex(x, y, z) {
    const xIdx = Math.floor(x + HALF_WIDTH);
    const yIdx = Math.floor(y);
    const zIdx = Math.floor(z + HALF_DEPTH);
    if (xIdx < 0 || xIdx >= WIDTH || yIdx < 0 || yIdx >= HEIGHT || zIdx < 0 || zIdx >= DEPTH) return -1;
    return xIdx + zIdx * WIDTH + yIdx * WIDTH * DEPTH;
}

function getPosFromIndex(idx) {

    return {
        x: xIdx - HALF_WIDTH + 0.5,
        y: yIdx + 0.5,
        z: zIdx - HALF_DEPTH + 0.5
    };
}

// 🌟 [추가] 블록에 테두리(Border)를 주어 입체감을 살리는 텍스처 생성 함수
function createBlockTexture(colorHex) {
    const canvas = document.createElement('canvas');
    canvas.width = 64; 
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    
    // 1. 기본 바탕색 채우기
    ctx.fillStyle = colorHex;
    ctx.fillRect(0, 0, 64, 64);
    
    // 2. 상단, 좌측에 얇은 밝은 테두리 (빛을 받는 느낌)
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(0, 0, 64, 2); // 위
    ctx.fillRect(0, 0, 2, 64); // 왼쪽
    
    // 3. 하단, 우측에 얇은 어두운 테두리 (그림자 지는 느낌)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.fillRect(0, 62, 64, 2); // 아래
    ctx.fillRect(62, 0, 2, 64); // 오른쪽
    
    const texture = new THREE.CanvasTexture(canvas);
    // 선명한 픽셀 형태 유지를 위해 필터링 설정
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    return texture;
}

// 🌟 [추가] 큐브블록(11번) 전용 텍스처: 실제 루빅스큐브처럼 면마다 다른 색의 3×3 스티커 배열
function createRubikFaceTexture(faceHex) {
    const canvas = document.createElement('canvas');
    canvas.width = 64; 
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    
    // 1. 바탕(스티커 사이 이음새)은 실제 루빅스큐브처럼 검정 계열
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(0, 0, 64, 64);
    
    // 2. 3×3 스티커: 면의 고유 색을 균일하게 채우고 베벨 음영만으로 미니큐브 입체감을 줌
    for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
            const x = 1 + i * 21, y = 1 + j * 21;
            ctx.fillStyle = faceHex;
            ctx.fillRect(x, y, 19, 19);
            // 각 미니큐브에 베벨(상단·좌측 밝게, 하단·우측 어둡게)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.30)';
            ctx.fillRect(x, y, 19, 2);
            ctx.fillRect(x, y, 2, 19);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
            ctx.fillRect(x, y + 17, 19, 2);
            ctx.fillRect(x + 17, y, 2, 19);
        }
    }
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    return texture;
}

// 🌟 미디어블록(12번) 면 텍스처: 큐브블록과 같은 면색 배치의 2×2 스티커 (재생버튼 없음)

// 🌟 [추가] 증분 갱신 시스템: 블록 1개 변경 시 86만 칸 재스캔 없이 해당 슬롯만 부분 GPU 업로드
const blockSlot = new Int32Array(MAP_SIZE).fill(-1);      // 블록 인덱스 → 색상 메시 내 슬롯 (11번 큐브블록은 별도 Map)
const colorSlotIndex = [];                                 // 색상별: 슬롯 → 블록 인덱스 (스왑 제거 시 매핑 유지)
const colorCounts = new Array(12).fill(0);                 // 색상별 라이브 인스턴스 수
const dirtyColorSlots = [];                                // 색상별 프레임 내 변경 슬롯 (렌더 직전 묶음 업로드)
const cubeBlockMeshMap = new Map();                        // 큐브블록(11번): 블록 인덱스 → 개별 Mesh
const mediaBlockMeshMap = new Map();                       // 미디어블록(12번): 블록 인덱스 → 개별 Mesh
let incTempObject = null, incSwapMatrix = null;            // 증분 갱신용 임시 객체 (지연 생성)
for (let c = 1; c <= 10; c++) {
    colorSlotIndex[c] = new Int32Array(MAX_INSTANCES_PER_COLOR).fill(-1);
    dirtyColorSlots[c] = [];
}
dirtyColorSlots[11] = [];

function markDirtySlot(c, slot) { dirtyColorSlots[c].push(slot); }

function addInstancedBlock(c, idx) {
    const imesh = instancedMeshes[c];
    if (!imesh) return;
    const slot = colorCounts[c];
    if (slot >= MAX_INSTANCES_PER_COLOR) return; // 색상별 용량 초과 — 대량 갱신 경로에서 처리
    if (!incTempObject) incTempObject = new THREE.Object3D();
    const pos = getPosFromIndex(idx);
    incTempObject.position.set(pos.x, pos.y, pos.z);
    incTempObject.updateMatrix();
    imesh.setMatrixAt(slot, incTempObject.matrix);
    colorSlotIndex[c][slot] = idx;
    blockSlot[idx] = slot;
    colorCounts[c] = slot + 1;
    imesh.count = colorCounts[c];
    markDirtySlot(c, slot);
}

function removeInstancedBlock(c, idx) {
    const imesh = instancedMeshes[c];
    if (!imesh) return;
    const slot = blockSlot[idx];
    if (slot < 0) return;
    const last = colorCounts[c] - 1;
    if (slot !== last) {
        // 스왑 제거: 마지막 인스턴스를 빈 슬롯으로 이동 — count가 렌더 범위라 원래 마지막 칸은 업로드 불필요
        const lastIdx = colorSlotIndex[c][last];
        if (!incSwapMatrix) incSwapMatrix = new THREE.Matrix4();
        imesh.getMatrixAt(last, incSwapMatrix);
        imesh.setMatrixAt(slot, incSwapMatrix);
        colorSlotIndex[c][slot] = lastIdx;
        blockSlot[lastIdx] = slot;
        colorSlotIndex[c][last] = -1;
        markDirtySlot(c, slot);
    }
    colorCounts[c] = last;
    imesh.count = last;
    blockSlot[idx] = -1;
}

function flushDirtyBlocks() {
    if (!isEngineInitialized) return;
    for (let c = 1; c <= 10; c++) {
        const list = dirtyColorSlots[c];
        if (!list || !list.length) continue;
        const n = list.length;
        const first = list[0];
        let minS = Infinity, maxS = -Infinity;
        for (let i = 0; i < n; i++) { const s = list[i]; if (s < minS) minS = s; if (s > maxS) maxS = s; }
        list.length = 0;
        const imesh = instancedMeshes[c];
        if (!imesh) continue;
        if (n === 1) {
            // 단일 변경: 슬롯 1칸(행렬 16 floats)만 업로드
            imesh.instanceMatrix.updateRange.offset = first * 16;
            imesh.instanceMatrix.updateRange.count = 16;
        } else {
            const span = maxS - minS + 1;
            if (span <= 1024) {
                imesh.instanceMatrix.updateRange.offset = minS * 16;
                imesh.instanceMatrix.updateRange.count = span * 16;
            } else {
                imesh.instanceMatrix.updateRange.offset = 0;
                imesh.instanceMatrix.updateRange.count = -1; // 광범위 변경 — 전체 업로드
            }
        }
        imesh.instanceMatrix.needsUpdate = true;
    }
}

function updateInstancedMeshes() {
    if (!isEngineInitialized) return;

    const colorLists = Array.from({ length: 13 }, () => []); 
    for (let i = 0; i < MAP_SIZE; i++) {
        const val = worldData[i];
        if (val > 0 && val <= 12) { 
            colorLists[val].push(i);
        }
    }

    const tempObject = new THREE.Object3D();
    for (let c = 1; c <= 12; c++) { 
        const imesh = instancedMeshes[c];
        if (!imesh) continue;

        const indices = colorLists[c];
        const count = Math.min(indices.length, MAX_INSTANCES_PER_COLOR);
        
        imesh.count = count;
        for (let i = 0; i < count; i++) {
            const pos = getPosFromIndex(indices[i]);
            tempObject.position.set(pos.x, pos.y, pos.z);
            tempObject.updateMatrix();
            imesh.setMatrixAt(i, tempObject.matrix);
        }
        imesh.instanceMatrix.needsUpdate = true;
    }

    // 🌟 [추가] 큐브블록(11번): 면색 6종 개별 메시로 렌더링 (개수가 적어 재구성 비용 거의 없음)
    if (cubeBlockGroup && cubeBlockGeo && rubikFaceMaterials) {
        while (cubeBlockGroup.children.length > 0) cubeBlockGroup.remove(cubeBlockGroup.children[0]);
        cubeBlockMeshMap.clear();
        for (const i of colorLists[11]) {
            const pos = getPosFromIndex(i);
            const block = new THREE.Mesh(cubeBlockGeo, rubikFaceMaterials);
            block.position.set(pos.x, pos.y, pos.z);
            block.castShadow = true;
            block.receiveShadow = true;
            cubeBlockGroup.add(block);
            cubeBlockMeshMap.set(i, block);
        }
    }

    // 🌟 미디어블록(12번): 큐브와 같은 면색 배치의 2×2 개별 메시로 렌더링
    if (mediaBlockGroup && cubeBlockGeo && mediaFaceMaterials) {
        while (mediaBlockGroup.children.length > 0) mediaBlockGroup.remove(mediaBlockGroup.children[0]);
        mediaBlockMeshMap.clear();
        for (const i of colorLists[12]) {
            const pos = getPosFromIndex(i);
            const block = new THREE.Mesh(cubeBlockGeo, mediaFaceMaterials);
            block.position.set(pos.x, pos.y, pos.z);
            block.userData = { colorId: 12, worldIdx: i };
            block.castShadow = true;
            block.receiveShadow = true;
            mediaBlockGroup.add(block);
            mediaBlockMeshMap.set(i, block);
        }
    }

    // 🌟 [추가] 증분 구조 전체 재동기화 (맵 로드/초기화 등 대량 변경 후 호출됨)
    blockSlot.fill(-1);
    for (let c = 1; c <= 10; c++) {
        const live = colorLists[c];
        const n = Math.min(live.length, MAX_INSTANCES_PER_COLOR);
        colorCounts[c] = n;
        colorSlotIndex[c].fill(-1);
        for (let s = 0; s < n; s++) {
            blockSlot[live[s]] = s;
            colorSlotIndex[c][s] = live[s];
        }
        dirtyColorSlots[c].length = 0;
        if (instancedMeshes[c]) instancedMeshes[c].instanceMatrix.updateRange.count = -1;
    }
    dirtyColorSlots[11].length = 0;
    pinkBlockCount = colorLists[11].length; // 🌟 [C안 ⑤] 전체 갱신 시 큐브블록 개수 재계산
}

// 박스 모서리 둥글게 (UV·재질그룹 유지 — 얼굴 텍스처 안 깨짐, 기어가기 scale과 충돌 없게 지오메트리에 baked)
function softenBox(geo, r) {
    const p = geo.parameters;
    const hx = p.width / 2 - r, hy = p.height / 2 - r, hz = p.depth / 2 - r;
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const qx = Math.max(-hx, Math.min(hx, v.x));
        const qy = Math.max(-hy, Math.min(hy, v.y));
        const qz = Math.max(-hz, Math.min(hz, v.z));
        const dx = v.x - qx, dy = v.y - qy, dz = v.z - qz;
        const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (len > r && len > 1e-6) {
            const s = r / len;
            pos.setXYZ(i, qx + dx * s, qy + dy * s, qz + dz * s);
        }
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();
}

function createSteveHeadTextures(isJjonji = false) {
    const materials = [];
    const faces = ['right', 'left', 'top', 'bottom', 'front', 'back'];
    // 얼굴 = 아이보리 고정, 고글 두눈 유지 / 머리카락 = 남녀 구분 없는 단발(밥) 스타일 (쫀지도 동일)
    const base = '#E8C1A2';
    const hair = '#4a2c11';
    const strap = '#2b2b2b';
    const rim = '#B0BEC5';
    const rimDark = '#78909C';

    faces.forEach(face => {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.scale(4, 4); // 64 좌표계 그대로 4배 해상도로 그리기 (확대해도 깨지지 않음)

        if (face === 'top') {
            ctx.fillStyle = hair; ctx.fillRect(0, 0, 64, 64);
        } else if (face === 'bottom') {
            ctx.fillStyle = base; ctx.fillRect(0, 0, 64, 64);
        } else if (face === 'front') {
            ctx.fillStyle = base; ctx.fillRect(0, 0, 64, 64);
            // 앞머리 (일자 뱅 + 옆으로 대각선 연결 — 눈과 겹치지 않게 아치형)
            ctx.fillStyle = hair;
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(64, 0); ctx.lineTo(64, 30);
            ctx.lineTo(52, 12); ctx.lineTo(12, 12); ctx.lineTo(0, 30);
            ctx.closePath(); ctx.fill();
            // 맨눈 + 얇은 테두리 (고글만큼 크게)
            const eyes = [[19, 30], [45, 30]];
            eyes.forEach(([cx, cy]) => {
                ctx.fillStyle = rimDark;
                ctx.beginPath(); ctx.arc(cx, cy, 13, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = rim;
                ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#212121';
                ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 3, cy - 5, 4, 4);
            });
            // 코 (작은 타원)
            ctx.fillStyle = '#D89A6B';
            ctx.beginPath(); ctx.ellipse(32, 43, 3.5, 2.5, 0, 0, Math.PI * 2); ctx.fill();
            // 미소
            ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(32, 47, 8, 0.4, Math.PI - 0.4); ctx.stroke();
        } else if (face === 'back') {
            ctx.fillStyle = hair; ctx.fillRect(0, 0, 64, 64);
        } else if (face === 'right' || face === 'left') {
            // 옆머리: 위·뒤는 덮고 앞-아래만 대각선으로 얼굴 노출 (right 캔버스 왼쪽=앞, left는 미러)
            ctx.fillStyle = hair; ctx.fillRect(0, 0, 64, 64);
            ctx.fillStyle = base;
            ctx.beginPath();
            if (face === 'right') {
                ctx.moveTo(0, 30); ctx.lineTo(0, 64); ctx.lineTo(44, 64); ctx.closePath();
            } else {
                ctx.moveTo(64, 30); ctx.lineTo(64, 64); ctx.lineTo(20, 64); ctx.closePath();
            }
            ctx.fill();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.magFilter = THREE.LinearFilter; texture.minFilter = THREE.LinearMipmapLinearFilter;
        materials.push(new THREE.MeshLambertMaterial({ map: texture }));
    });
    return materials;
}

function createSteveArmTextures(isJjonji = false, sleeveHex = null) {
    const materials = [];
    const faces = ['right', 'left', 'top', 'bottom', 'front', 'back'];
    // 최초 방식: 위 소매(티셔츠색, 쫀지는 진회색) + 아래 손(아이보리, 쫀지도 동일)
    const sleeveColor = isJjonji ? '#404040' : (sleeveHex || '#00cbc9');
    const skinColor = '#E8C1A2';
    faces.forEach(face => {

        if (face === 'top') {
            ctx.fillStyle = sleeveColor; ctx.fillRect(0, 0, 16, 32);
        } else if (face === 'bottom') {

        } else {
            ctx.fillStyle = sleeveColor; ctx.fillRect(0, 0, 16, 13);

        const texture = new THREE.CanvasTexture(canvas);
        texture.magFilter = THREE.NearestFilter; texture.minFilter = THREE.NearestFilter;
        materials.push(new THREE.MeshLambertMaterial({ map: texture }));
    });
    return materials;
}

function drawRoundRect(ctx, x, y, width, height, radius) {
    if (typeof ctx.roundRect === 'function') {
        ctx.roundRect(x, y, width, height, radius);
    } else {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
    }
}

function createNameplate(name) {
    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
    ctx.font = `bold 33px "Noto Sans KR", "Noto Sans KR Latin", sans-serif`; const w = ctx.measureText(name).width + 32;
    canvas.width = w + 8; canvas.height = 72;
    ctx.font = `bold 33px "Noto Sans KR", "Noto Sans KR Latin", sans-serif`; ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.beginPath(); 
    drawRoundRect(ctx, 4, 4, w, 56, 12); 
    ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
    sprite.scale.set(0.618 * (canvas.width / canvas.height), 0.618, 1); return sprite;
}

    const legMat = new THREE.MeshLambertMaterial({ color: parseInt(pantsHex.slice(1), 16) }); // 쫀지: 검정(팔레트 10번)
    const lL = new THREE.Mesh(legGeo, legMat); lL.position.set(-0.2, 0.4, 0); lL.name = "leftLeg"; lL.castShadow = true; group.add(lL);
    const rL = new THREE.Mesh(legGeo, legMat); rL.position.set(0.2, 0.4, 0); rL.name = "rightLeg"; rL.castShadow = true; group.add(rL);

    const armGeo = new THREE.BoxGeometry(0.24, 0.6, 0.35, 2, 2, 2); softenBox(armGeo, 0.05); armGeo.translate(0, -0.3, 0);
    const lA = new THREE.Mesh(armGeo, createSteveArmTextures(isJjonji, outfit.shirt)); lA.position.set(-0.5, 1.0, 0); lA.name = "leftArm"; lA.castShadow = true; group.add(lA);
    const rA = new THREE.Mesh(armGeo, createSteveArmTextures(isJjonji, outfit.shirt)); rA.position.set(0.5, 1.0, 0); rA.name = "rightArm"; rA.castShadow = true; group.add(rA);
    
    const np = createNameplate(name); np.position.y = 2.6; np.name = "nameplate"; group.add(np);
    
    if (!isJjonji) {
        const lifeGauge = createLifeGaugeGroup();
        group.add(lifeGauge);
    }
    
    if (scene) scene.add(group);
    return group;
}

// 🌟 좀비화: 캐릭터의 모든 색(텍스처 포함)을 회색음영으로 변환. 이름표는 유지, 한 번만 적용됨
function zombifyCharacter(group) {
    if (!group || group.userData.zombified) return;
    group.userData.zombified = true;
    group.traverse((obj) => {
        if (obj.isSprite) return; // 이름표는 그대로 유지
        if (!obj.isMesh || !obj.material) return;
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach((mat) => {
            if (mat.color) {
                const c = mat.color;
                const l = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b; // 현재 색의 밝기를 유지한 채 무채색으로
                mat.color.setRGB(l, l, l);
            }
            if (mat.map && mat.map.image && mat.map.image.width) {
                const src = mat.map.image;
                const grayCanvas = document.createElement('canvas');
                grayCanvas.width = src.width; grayCanvas.height = src.height;
                const gctx = grayCanvas.getContext('2d');
                gctx.drawImage(src, 0, 0);
                const img = gctx.getImageData(0, 0, grayCanvas.width, grayCanvas.height);
                const d = img.data;
                for (let i = 0; i < d.length; i += 4) {
                    const g = Math.round(0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]);
                    d[i] = g; d[i+1] = g; d[i+2] = g;
                }
                gctx.putImageData(img, 0, 0);
                const grayTex = new THREE.CanvasTexture(grayCanvas);
                grayTex.magFilter = mat.map.magFilter;
                grayTex.minFilter = mat.map.minFilter;
                mat.map = grayTex;
                mat.needsUpdate = true;
            }
        });
    });
}

function checkCollision(px, py, pz, forceCrawlCheck = null, horizontalMargin = 0) {
    // 🌟 [쫀지] 투명인간 모드가 켜져 있을 때만 블록 통과
    if (isEasterEgg && ghostMode) return false; 
    
    const r = 0.35 - horizontalMargin;
    const activeCrawling = (forceCrawlCheck !== null) ? forceCrawlCheck : charPhysics.isCrawling;
    const h = activeCrawling ? 0.85 : 1.95;
    
    const minX = Math.floor(px - r + HALF_WIDTH);
    const maxX = Math.floor(px + r + HALF_WIDTH);
    const minY = Math.floor(py);
    const maxY = Math.floor(py + h);
    const minZ = Math.floor(pz - r + HALF_DEPTH);
    const maxZ = Math.floor(pz + r + HALF_DEPTH);
    
    for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
            for (let z = minZ; z <= maxZ; z++) {
                if (x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT && z >= 0 && z < DEPTH) {
                    const idx = x + z * WIDTH + y * WIDTH * DEPTH;
                    if (worldData[idx] > 0) return true;
                }
            }
        }
    }
    return false;
}

// 🌟 공격 시선 차단: 공격자 눈↔대상 눈 사이 블록 관통 검사
//    서 있으면 눈 +1.5 (1칸 벽 너머 가능, 2칸 이상 차단), 기어다니면 눈 +0.5 (1칸 벽에 완전 은폐)
const tmpEyeA = new THREE.Vector3(), tmpEyeB = new THREE.Vector3(), tmpEyeDir = new THREE.Vector3();
function isWallBetweenEyes(targetPlayer) {
    tmpEyeA.copy(characterGroup.position);
    tmpEyeA.y += charPhysics.isCrawling ? 0.5 : 1.5;
    tmpEyeB.copy(targetPlayer.group.position);
    tmpEyeB.y += targetPlayer.isCrawling ? 0.5 : 1.5;
    tmpEyeDir.subVectors(tmpEyeB, tmpEyeA);
    const dist = tmpEyeDir.length();
    if (dist < 0.001) return false;
    tmpEyeDir.normalize();
    raycaster.set(tmpEyeA, tmpEyeDir);
    const prevFar = raycaster.far;
    raycaster.far = dist - 0.3; // 대상 몸체 히트는 제외
    const intersectables = [floorMesh];
    for (let c = 1; c <= 11; c++) {
        if (instancedMeshes[c]) intersectables.push(instancedMeshes[c]);
    }
    if (cubeBlockGroup) intersectables.push(cubeBlockGroup);
    if (mediaBlockGroup) intersectables.push(mediaBlockGroup);
    const hits = raycaster.intersectObjects(intersectables, true);
    raycaster.far = prevFar;
    return hits.length > 0;
}

function checkPinkBlockCollision(px, py, pz) {
    const r = 0.35;
    const minX = Math.floor(px - r + HALF_WIDTH);
    const maxX = Math.floor(px + r + HALF_WIDTH);
    const minZ = Math.floor(pz - r + HALF_DEPTH);
    const maxZ = Math.floor(pz + r + HALF_DEPTH);
    // 🌟 발 높이 ±1층의 큐브에만 반응 (머리 위·발 밑 큐브를 스쳐도 발동하지 않음)
    const minY = Math.max(0, Math.floor(py) - 1);
    const maxY = Math.min(HEIGHT - 1, Math.floor(py) + 1);
    
    for (let x = minX; x <= maxX; x++) {
        for (let z = minZ; z <= maxZ; z++) {
            for (let y = minY; y <= maxY; y++) {
                if (x >= 0 && x < WIDTH && z >= 0 && z < DEPTH) {
                    const idx = x + z * WIDTH + y * WIDTH * DEPTH;
                    if (worldData[idx] === 11) {
                        return true;
                    }
                }
            }
        }
    }
    return false;
}

// 🌟 접속 시 또는 맵 로드 시 스폰/현재 위치에 블록이 있으면, 해당 위치의 가장 높은 블록 꼭대기 위로 캐릭터를 단번에 들어올림
//    (블록에 끼이거나 갇히는 현상을 100% 원천 방지하며, 즉시 서버로 위치를 동기화하여 타인/관제에도 반영)
function liftCharacterOutOfBlocks() {
    if (!charPhysics || !isEngineInitialized) return;
    if (isEasterEgg && ghostMode) return; // 쫀지가 투명인간(유령) 모드일 때만 통과 허용

    const p = charPhysics.position;
    // 🌟 캐릭터가 스폰 지점(중앙 x=0, z=0 부근)일 때는 스폰 4칸 구역(x: 59~60, z: 59~60) 전체를 아울러 검사
    const isAtSpawn = (Math.abs(p.x) < 2 && Math.abs(p.z) < 2);
    const minX = isAtSpawn ? 59 : Math.max(0, Math.floor(p.x - 0.38 + HALF_WIDTH));
    const maxX = isAtSpawn ? 60 : Math.min(WIDTH - 1, Math.floor(p.x + 0.38 + HALF_WIDTH));
    const minZ = isAtSpawn ? 59 : Math.max(0, Math.floor(p.z - 0.38 + HALF_DEPTH));
    const maxZ = isAtSpawn ? 60 : Math.min(DEPTH - 1, Math.floor(p.z + 0.38 + HALF_DEPTH));

    // 🌟 몸통과 실제로 겹치는 블록만 수집 (다리·천장 밑 통과는 겹침 없음 → 올리지 않음)
    //    몸통 범위: 발 y-1.0 ~ 머리 y+1.95 (기어가기 y+0.85) — 건축 겹침 판정과 동일 기준
    //    겹침이 없을 때까지 반복 상승하므로 깊은 매몰도 완전히 탈출함 (이벤트 시점에만 동작)
    const yStart = p.y;
    for (let guard = 0; guard < HEIGHT; guard++) {
        const bodyTop = p.y + (charPhysics.isCrawling ? 0.85 : 1.95);
        let maxOverlapY = -1;
        for (let y = 0; y < HEIGHT; y++) {
            if (y + 0.5 <= p.y - 1.0 || y - 0.5 >= bodyTop) continue; // 몸통과 수직으로 안 겹치면 스킵
            for (let x = minX; x <= maxX; x++) {
                for (let z = minZ; z <= maxZ; z++) {
                    const idx = y * (WIDTH * DEPTH) + z * WIDTH + x;
                    if (worldData[idx] > 0) {
                        if (y > maxOverlapY) maxOverlapY = y;
                    }
                }
            }
        }
        // 겹친 블록이 없거나, 발이 블록 상단과 거의 맞닿았으면(정상 착지) 종료
        if (maxOverlapY < 0 || p.y >= maxOverlapY + 1 - 0.03) break;
        p.y = maxOverlapY + 1.02;
    }

    // 실제로 움직였을 때만 착지 처리 + 위치 동기화
    if (p.y !== yStart) {
        charPhysics.velocity.set(0, 0, 0);
        charPhysics.isGrounded = true; // 블록 상단에 즉시 안전 착지
        
        // 위치 변경을 서버와 다른 모든 접속자/관제에 즉시 전송 (끼임 해소 큰 이동임을 표시)
        // 🌟 단, 소환 직후 300ms는 서버 배치가 이미 전파했으므로 생략. 월드 준비+입장 확정 전도 생략 (기본값 방송 차단)
        if (worldReady && joinPositioned && socket && socket.connected && Date.now() >= teleportQuietUntil) {
            socket.emit('player-move', {
                x: p.x,
                y: p.y,
                z: p.z,
                rotY: characterGroup ? characterGroup.rotation.y : 0,
                isCrawling: charPhysics.isCrawling,
                lift: true
            });
        }
    }
}

function handleInteract() {
    if (!isEngineInitialized) return;
    // 🌟 미디어블록 터치 우선 처리: 쫀지는 설정 팝업, 일반은 안전모드에서 열람 (5칸·시야 적용)
    if (tryMediaTouch()) return;
    if (freezeAll && !isEasterEgg) return; // 🌟 전체 동결 중 일반 접속자 블록 설치/삭제 불가 (쫀지는 항상 가능)

    if (!isEasterEgg && (globalMode === 'ATTACK' || globalMode === 'SAFE')) return; 
    
    if (!isEasterEgg && selectedToolType !== 'eraser') {
        const colorId = activeHotbarIndex + 1;
        if (colorId === 11) return; 
    }

    raycaster.setFromCamera(mouse, camera);
    
    const intersectables = [floorMesh];
    for (let c = 1; c <= 11; c++) {
        if (instancedMeshes[c]) intersectables.push(instancedMeshes[c]);
    }
    if (cubeBlockGroup) intersectables.push(cubeBlockGroup); // 큐브블록도 광선에 응답 (광선이 통과하지 않도록)
    if (mediaBlockGroup) intersectables.push(mediaBlockGroup); // 미디어블록도 광선에 응답
    
    const intersects = raycaster.intersectObjects(intersectables, true); // true: 그룹(cubeBlockGroup) 안의 개별 메시까지 탐색
    if (intersects.length > 0) {
        const hit = intersects[0];
        let targetPos = new THREE.Vector3();
        
        if (selectedToolType === "eraser") {
            if (hit.object === floorMesh) return;
            if (hit.instanceId !== undefined && hit.object instanceof THREE.InstancedMesh) {
                const tempMatrix = new THREE.Matrix4();
                hit.object.getMatrixAt(hit.instanceId, tempMatrix);
                targetPos.setFromMatrixPosition(tempMatrix);
                
                targetPos.x = Math.floor(targetPos.x) + 0.5;
                targetPos.y = Math.floor(targetPos.y) + 0.5;
                targetPos.z = Math.floor(targetPos.z) + 0.5;
            } else if (cubeBlockGroup && hit.object.parent === cubeBlockGroup) {
                targetPos.copy(hit.object.position); // 큐브블록 메시 위치 = 칸 중심(.5 좌표)
            } else if (mediaBlockGroup && hit.object.parent === mediaBlockGroup) {
                targetPos.copy(hit.object.position); // 미디어블록 메시 위치 = 칸 중심(.5 좌표)
            } else {
                return;
            }
        } 
        else {
            if (hit.object instanceof THREE.InstancedMesh && hit.instanceId !== undefined) {
                const tempMatrix = new THREE.Matrix4();
                hit.object.getMatrixAt(hit.instanceId, tempMatrix);
                const blockCenter = new THREE.Vector3();
                blockCenter.setFromMatrixPosition(tempMatrix);
                targetPos.copy(blockCenter).add(hit.face.normal);
            } else if (cubeBlockGroup && hit.object.parent === cubeBlockGroup) {
                targetPos.copy(hit.object.position).add(hit.face.normal); // 큐브블록 면 기준 인접 칸
            } else if (mediaBlockGroup && hit.object.parent === mediaBlockGroup) {
                targetPos.copy(hit.object.position).add(hit.face.normal); // 미디어블록 면 기준 인접 칸
            } else if (hit.object === floorMesh) {
                targetPos.copy(hit.point).add(hit.face.normal.clone().multiplyScalar(0.5));
            } else {
                return;
            }
            
            targetPos.x = Math.floor(targetPos.x) + 0.5;
            targetPos.y = Math.floor(targetPos.y) + 0.5;
            targetPos.z = Math.floor(targetPos.z) + 0.5;
            
            if (targetPos.y < 0.5) targetPos.y = 0.5;
        }
        
        if (targetPos.y >= 60.0) return;
        
        const idx = getIndex(targetPos.x, targetPos.y, targetPos.z);
        if (idx === -1) return;
        
        // 🌟 큐브블록(11번)·미디어블록(12번)은 일반 접속자가 삭제할 수 없음 (운영자만 가능)
        if (!isEasterEgg && selectedToolType === 'eraser' && (worldData[idx] === 11 || worldData[idx] === 12)) {
            const toast = document.getElementById('toast');
            if (toast) { toast.textContent = worldData[idx] === 12 ? '미디어블록은 삭제할 수 없습니다!' : '큐브블록은 삭제할 수 없습니다!'; toast.classList.remove('opacity-0'); setTimeout(() => toast.classList.add('opacity-0'), 1200); }
            return;
        }
        
        const xIdx = Math.floor(targetPos.x + HALF_WIDTH);
        const zIdx = Math.floor(targetPos.z + HALF_DEPTH);
        const isCenterSpawnArea = (xIdx === 59 || xIdx === 60) && (zIdx === 59 || zIdx === 60);
        
        if (!isEasterEgg && isCenterSpawnArea) return; 
        
        const distToChar = charPhysics.position.distanceTo(targetPos);
        if (isEasterEgg || distToChar <= 5.0) {
            if (selectedToolType !== 'eraser') {
                if (!isEasterEgg) {
                    let isOccupied = false;
                    const checkOverlap = (px, py, pz, blockPos) => {
                        const dx = Math.abs(px - blockPos.x);
                        const dz = Math.abs(pz - blockPos.z);
                        const inX = dx < 0.85; 
                        const inZ = dz < 0.85;
                        const inY = (blockPos.y - 0.5 < py + 1.95) && (blockPos.y + 0.5 > py - 1.0);
                        return inX && inZ && inY;
                    };

                    if (checkOverlap(charPhysics.position.x, charPhysics.position.y, charPhysics.position.z, targetPos)) {
                        isOccupied = true;
                    }
                    remotePlayers.forEach(p => {
                        if (checkOverlap(p.target.x, p.target.y, p.target.z, targetPos)) {
                            isOccupied = true;
                        }
                    });

                    if (isOccupied) return; 

                    if (checkCollision(charPhysics.position.x, charPhysics.position.y, charPhysics.position.z)) return;
                }
            }
            
            const colorId = activeHotbarIndex + 1;
            socket.emit('block-change', { type: selectedToolType, index: idx, colorId: colorId });
            // 🌟 쫀지가 미디어블록을 지우면 연결된 링크도 함께 제거 요청
            if (isEasterEgg && selectedToolType === 'eraser' && worldData[idx] === 12) socket.emit('media-remove', { index: idx });
            // 🌟 설치/삭제 효과음은 실행한 본인 화면에서만 재생
            if (selectedToolType === 'eraser') sfx.playBreak(); else sfx.playPlace();
            // 🌟 쫀지가 미디어블록을 새로 설치하면 링크 설정 팝업 (기존 미디어 터치는 tryMediaTouch에서 설정 팝업)
            if (isEasterEgg && selectedToolType !== 'eraser' && colorId === 12) openMediaEditor(idx);
        }
    }
}

function applyBlockChange(data) {
    const idx = data.index;
    if (idx < 0 || idx >= MAP_SIZE) return;
    const isErase = data.type === 'eraser';
    const oldVal = worldData[idx];
    const newVal = isErase ? 0 : data.colorId;
    if (oldVal === newVal) return;

    // 🌟 증분 갱신: 변경된 블록만 슬롯 조작 (전체 재스캔·전체 업로드 없음, 효과음은 본인 화면에서만)
    if (oldVal === 11 && cubeBlockGroup) {
        const mesh = cubeBlockMeshMap.get(idx);
        if (mesh) { cubeBlockGroup.remove(mesh); cubeBlockMeshMap.delete(idx); }
    } else if (oldVal === 12 && mediaBlockGroup) {
        const mesh = mediaBlockMeshMap.get(idx);
        if (mesh) { mediaBlockGroup.remove(mesh); mediaBlockMeshMap.delete(idx); }
    } else if (oldVal >= 1 && oldVal <= 10) {
        removeInstancedBlock(oldVal, idx);
    }
    if (newVal === 11 && cubeBlockGroup && cubeBlockGeo && rubikFaceMaterials) {
        const pos = getPosFromIndex(idx);
        const block = new THREE.Mesh(cubeBlockGeo, rubikFaceMaterials);
        block.position.set(pos.x, pos.y, pos.z);
        block.castShadow = true;
        block.receiveShadow = true;
        cubeBlockGroup.add(block);
        cubeBlockMeshMap.set(idx, block);
    } else if (newVal === 12 && mediaBlockGroup && cubeBlockGeo && mediaFaceMaterials) {
        const pos = getPosFromIndex(idx);
        const block = new THREE.Mesh(cubeBlockGeo, mediaFaceMaterials);
        block.position.set(pos.x, pos.y, pos.z);
        block.userData = { colorId: 12, worldIdx: idx };
        block.castShadow = true;
        block.receiveShadow = true;
        mediaBlockGroup.add(block);
        mediaBlockMeshMap.set(idx, block);
    } else if (newVal >= 1 && newVal <= 10) {
        addInstancedBlock(newVal, idx);
    }
    worldData[idx] = newVal;
    // 🌟 미디어블록이 지워지면 링크 정보도 로컬에서 정리 (서버 media-removed와 멱등)
    if (isErase && oldVal === 12 && typeof mediaInfo === 'object' && mediaInfo !== null) delete mediaInfo[idx];
    // 🌟 [C안 ⑤] 큐브블록 개수 캐시 갱신 (0개면 트랩 스캔 생략)
    if (oldVal === 11) pinkBlockCount--;
    if (newVal === 11) pinkBlockCount++;
}

function initEngine() {
    const canvas = document.getElementById('game-canvas');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8bcbf9);
    scene.fog = new THREE.FogExp2(0x8bcbf9, 0.012);
    
    camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, qualityViewDistance(currentQuality));
    // v4 성능 실험: preserveDrawingBuffer 제거(캡처 핸들러가 toDataURL 직전 renderer.render()를 다시 호출하므로 불필요)
    // 안드로이드는 MSAA 비용이 커서 기본 OFF, iPad/PC는 기존처럼 ON
    // 🌟 [C안 ①] powerPreference: 복합 GPU 기기에서 고성능 GPU 우선 사용 유도
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !isAndroidDevice, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.05;
    controls.maxDistance = 15; controls.minDistance = 4;
    controls.maxPolarAngle = Math.PI * (75 / 180); controls.minPolarAngle = Math.PI * (1 / 180);
    
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: null };
    
    const startDist = 9.5, rad30 = Math.PI / 6;
    camera.position.set(0, startDist * Math.sin(rad30) + 1.5, startDist * Math.cos(rad30));
    controls.target.set(0, 0, 0); controls.update();
    
    // AmbientLight (환경광)
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    
    // 방향성 조명 (그림자)
    sunLight = new THREE.DirectionalLight(0xffffff, 0.85);
    sunLight.position.set(20, 60, 10); 
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;  
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 150;
    
    const d = 40;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005; 
    scene.add(sunLight);
    
    floorMesh = new THREE.Mesh(new THREE.BoxGeometry(FLOOR_SIZE, 1, FLOOR_SIZE), new THREE.MeshLambertMaterial({ color: 0x59893d }));
    floorMesh.position.y = -0.5; floorMesh.receiveShadow = true; scene.add(floorMesh);
    
    const gridHelper = new THREE.GridHelper(FLOOR_SIZE, FLOOR_SIZE, 0x466d2e, 0x4d7535);
    gridHelper.position.y = 0.01; scene.add(gridHelper);
    
    // 🌟 [수정] 텍스처(테두리)가 들어갔으므로 블록 크기를 1x1x1 꽉 차게 변경
    const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
    // 🌟 [추가] 큐브블록(11번): 실제 루빅스큐브처럼 면마다 다른 색 재질 6종
    // (박스 면 그룹 순서: 동(+x)=파랑, 서(-x)=초록, 위(+y)=흰색, 아래(-y)=노랑, 남(+z)=빨강, 북(-z)=주황)
    const rubikFaceColors = [colorPalette[1], colorPalette[3], colorPalette[8], colorPalette[2], colorPalette[4], colorPalette[5]];
    // 동=빨강, 서=노랑, 위=흰색, 아래=주황, 남=초록, 북=파랑 — 모두 기본 블록 팔레트 색상 그대로
    rubikFaceMaterials = rubikFaceColors.map(hex => new THREE.MeshLambertMaterial({ map: createRubikFaceTexture(hex) }));
    cubeBlockGeo = cubeGeo;
    cubeBlockGroup = new THREE.Group();
    scene.add(cubeBlockGroup);
    // 🌟 미디어블록(12번): 큐브와 같은 면색 배치 + 면당 2×2 스티커
    mediaFaceMaterials = rubikFaceColors.map(hex => new THREE.MeshLambertMaterial({ map: createMediaFaceTexture(hex) }));
    mediaBlockGroup = new THREE.Group();
    scene.add(mediaBlockGroup);
    for (let c = 1; c <= 11; c++) {
        // 큐브블록(11번)은 InstancedMesh 대신 cubeBlockGroup에서 면색 6종 메시로 렌더링
        // 미디어블록(12번)은 mediaBlockGroup에서 2×2 면색 메시로 렌더링
        if (c === 11) continue;
        // 🌟 [추가] 색상별로 테두리(Bevel)가 입혀진 특수 텍스처 적용
        const texture = createBlockTexture(colorPalette[c]);
        const mat = new THREE.MeshLambertMaterial({ map: texture });
        
        const imesh = new THREE.InstancedMesh(cubeGeo, mat, MAX_INSTANCES_PER_COLOR);
        imesh.count = 0;
        imesh.castShadow = true;
        imesh.receiveShadow = true;
        scene.add(imesh);
        instancedMeshes[c] = imesh;
    }
    
    characterGroup = buildSteveCharacter(steveName, isEasterEgg);
    localParts = collectParts(characterGroup); // 🌟 [C안 ②] 부위 참조 캐싱 (매 프레임 씬 순회 제거)
    prevCharPos.copy(characterGroup.position);
    
    isEngineInitialized = true;
    updateInstancedMeshes();
    markWorldReady(); // init-state가 먼저 와 있었으면 확정 좌표로 탈출+방송
    syncInitialPlayers();
    
    updateAdminUI();
    updateNormalUserUI();
    updateLifeGaugeVisibility();
    applyQuality(currentQuality);
}

function syncInitialPlayers() {
    if (!initialPlayerData || !scene) return;
    
    remotePlayers.forEach((p) => { if (p.group && p.group.parent) scene.remove(p.group); });
    remotePlayers.clear();

    for (const id in initialPlayerData) {
        if (id !== socket.id) {
            const isJjonji = initialPlayerData[id].isJjonji || false;
            const remoteGroup = buildSteveCharacter(initialPlayerData[id].name, isJjonji, initialPlayerData[id].outfit);
            const isZombie = initialPlayerData[id].isZombie || false;
            if (isZombie) {
                const g = remoteGroup.getObjectByName("lifeGauge");
                if (g) g.visible = false;
                zombifyCharacter(remoteGroup);
            } else {
                // 🌟 스냅샷의 남은 생명 수를 게이지에 반영 (새로고침한 관전 화면에서도 정확히 표시)
                const g = remoteGroup.getObjectByName("lifeGauge");
                if (g) for (let i = 0; i < 3; i++) g.children[i].visible = (i < (initialPlayerData[id].lives || 0));
            }
            scene.add(remoteGroup);
            remotePlayers.set(id, {
                group: remoteGroup,
                target: new THREE.Vector3(initialPlayerData[id].x, initialPlayerData[id].y, initialPlayerData[id].z),
                crawlProgress: 0,
                isCrawling: initialPlayerData[id].isCrawling,
                isZombie: isZombie,
                isJjonji: isJjonji,
                name: initialPlayerData[id].name || 'Steve',
                outfit: initialPlayerData[id].outfit || null,
                parts: collectParts(remoteGroup) // 🌟 [C안 ②] 부위 캐싱
            });
            // 🌟 스냅샷 위치를 초기 위치로 즉시 반영 (스폰에서 순간이동하는 것처럼 보이지 않게)
            remoteGroup.position.copy(remotePlayers.get(id).target);
        }
    }
}

function saveWorldToFile() {
    const blockData = {};
    for (let i = 0; i < MAP_SIZE; i++) {
        if (worldData[i] <= 0) continue;
        // 🌟 미디어블록은 색상+링크를 함께 저장 (관제 저장과 동일 형식)
        const m = (worldData[i] === 12) ? mediaInfo[i] : null;
        blockData[i] = (m && m.url && m.kind) ? { c: 12, url: m.url, kind: m.kind } : worldData[i];
    }
    const blob = new Blob([JSON.stringify(blockData)], { type: "application/json" });
    const now = new Date(), yy = String(now.getFullYear()).slice(-2), mm = String(now.getMonth() + 1).padStart(2, '0'), dd = String(now.getDate()).padStart(2, '0'), hh = String(now.getHours()).padStart(2, '0'), min = String(now.getMinutes()).padStart(2, '0'), ss = String(now.getSeconds()).padStart(2, '0');
    
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `KSMS-${yy}${mm}${dd}-${hh}${min}${ss}.블록세상`;
    link.click();
}

// 🌟 원시 맵 객체를 월드에 적용 (파일 불러오기·번들 맵 자동 로드 공용, 텍스트 미디어 포함)
function applyRawMap(raw) {
    if (!raw || typeof raw !== 'object') return false;
    worldData.fill(0);
    mediaInfo = {};
    for (const idx in raw) {
        const n = Number(idx);
        if (!Number.isInteger(n) || n < 0 || n >= MAP_SIZE) continue;
        const v = raw[idx];
        if (v && typeof v === 'object') {
            const cid = Number(v.c);
            if (!Number.isInteger(cid) || cid < 1 || cid > 12) continue;
            worldData[n] = cid;
            if (cid === 12) {
                const cm = cleanMediaInfo({ url: v.url, kind: v.kind, text: v.text });
                if (cm) mediaInfo[n] = cm;
            }
        } else {
            const cid = Number(v);
            if (!Number.isInteger(cid) || cid < 1 || cid > 12) continue;
            worldData[n] = cid;
        }
    }
    if (isEngineInitialized) updateInstancedMeshes();
    return true;
}

// 🌟 번들 맵 자동 로드 (index.html과 같은 폴더의 map.블록세상 — 없으면 빈 월드)
function loadBundledMap() {
    return fetch('map.블록세상').then((r) => {
        if (!r.ok) throw new Error('no map');
        return r.json();
    }).then((raw) => {
        applyRawMap(raw);
    }).catch(() => {});
}

function loadWorldFromFile(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
        try {
            const raw = JSON.parse(evt.target.result);
            if (isVirtualMode) {
                // 🌟 가상 모드도 검증 후 복원 (미디어 링크·텍스트 포함)
                if (!applyRawMap(raw)) throw new Error('bad map');
                liftCharacterOutOfBlocks(); // 불러온 맵에 파묻히면 블록 위로 (멀티와 동일)
            } else {
                socket.emit('admin-load-map', raw);
            }
            e.target.value = ""; sfx.playPlace();
        } catch (err) {
            alert("올바르지 않은 맵 파일 형식입니다."); e.target.value = "";
        }
    };
    reader.readAsText(file);
}

function triggerDamageFlash() {
    const flash = document.getElementById('damage-flash');
    if (!flash) return;
    flash.style.transition = 'none';
    flash.style.opacity = '1';
    flash.offsetHeight; 
    flash.style.transition = 'opacity 0.5s ease-out';
    flash.style.opacity = '0';
}

socket.on('init-state', (data) => {
    worldData.fill(0);
    for (const idx in data.blocks) worldData[idx] = data.blocks[idx];
    mediaInfo = {};
    if (data.media && typeof data.media === 'object') {
        for (const k of Object.keys(data.media)) {
            if (isSafeMediaInfo(data.media[k])) mediaInfo[k] = { url: data.media[k].url, kind: data.media[k].kind };
        }
    }
    globalMode = data.globalMode || 'SAFE'; 
    if (typeof data.freezeAll === 'boolean') updateFreezeUI(data.freezeAll);
    if (isEngineInitialized) {
        updateInstancedMeshes();
        updateAdminUI();
        updateNormalUserUI();

    initialPlayerData = data.players;

    initStateSeen = true;
    if (worldReadyTimer) clearTimeout(worldReadyTimer);
    worldReadyTimer = setTimeout(markWorldReady, 10000); // 안전망: 10초 뒤 강제 해제 (최악 = 기존 동작)
    if (isEngineInitialized) markWorldReady();
});

socket.on('player-joined', (data) => {
    if (!isEngineInitialized) {
        // 🌟 엔진 초기화 전(이름 입력 대기 중) 접속자는 버리지 않고 기록 —
        //    입장 시 syncInitialPlayers가 일괄 생성하므로 "안 보이는" 문제가 사라짐
        if (!initialPlayerData) initialPlayerData = {};
        initialPlayerData[data.id] = data.player;
        return;
    }
    if (!remotePlayers.has(data.id)) {
        const isJjonji = data.player.isJjonji || false;
        const remoteGroup = buildSteveCharacter(data.player.name, isJjonji, data.player.outfit);
        const isZombie = data.player.isZombie || false;
        scene.add(remoteGroup); // 🌟 [핵심 수정] 3D 장면에 확실하게 추가!
        const initialTarget = new THREE.Vector3(data.player.x || 0, data.player.y || 0, data.player.z || 0);
        remoteGroup.position.copy(initialTarget); // 🌟 초기 위치 즉시 동기화
        remotePlayers.set(data.id, {
            group: remoteGroup, target: initialTarget,
            crawlProgress: 0, isCrawling: !!data.player.isCrawling,
            isZombie: isZombie,

        });
        if (isZombie) zombifyCharacter(remoteGroup);
        else {

        }

    }
});

socket.on('player-moved', (data) => {

    const p = remotePlayers.get(data.id);
    if (p) {
        p.target.set(data.player.x, data.player.y, data.player.z);
