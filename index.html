});

// 🌟 [P0-3] 소환 배치 수신: N회 broadcast 대신 1회로 전원 목표 좌표 갱신
socket.on('summon-batch', (data) => {
    if (!isEngineInitialized || !data || !Array.isArray(data.list)) return;
    for (const m of data.list) {
        if (!m || typeof m.id !== 'string') continue;
        const p = remotePlayers.get(m.id);
        if (p && Number.isFinite(m.x) && Number.isFinite(m.y) && Number.isFinite(m.z)) {
            p.target.set(m.x, m.y, m.z);
        }
    }
});

socket.on('player-left', (data) => {
    if (!isEngineInitialized) {
        // 🌟 엔진 초기화 전에 퇴장한 플레이어는 입장 시 동기화 목록에서도 제거
        if (initialPlayerData) delete initialPlayerData[data.id];

socket.on('player-life-updated', (data) => {
    if (data.id === socket.id) {
        sfx.playHit(); // 🌟 피격 효과음은 피격자 본인 화면에서만
        if (data.isZombie) {
            myIsZombie = true;
        } else if (myIsZombie) {
            myIsZombie = false;
            reviveLocalCharacter(); // 🌟 치료: 회색 좀비 → 정상 캐릭터 재생성
        }
        if (characterGroup) {
            const gauge = characterGroup.getObjectByName("lifeGauge");
            if (gauge) {
                if (myIsZombie) {
                    gauge.visible = false; // 🌟 좀비는 생명표시 제거
                } else {
                    for (let i = 0; i < 3; i++) { gauge.children[i].visible = (i < data.lives); }
                }
            }
            if (myIsZombie) zombifyCharacter(characterGroup); // 🌟 회색음영 좀비로 변신
        }
        triggerDamageFlash();
    } else {
        const p = remotePlayers.get(data.id);
        if (p && p.group) {
            if (data.isZombie) {
                p.isZombie = true;
                zombifyCharacter(p.group);
                const gauge = p.group.getObjectByName("lifeGauge");
                if (gauge) gauge.visible = false;
            } else {
                if (p.isZombie) reviveRemoteCharacter(data.id, p); // 🌟 치료: 회색 좀비 → 정상 캐릭터 재생성
                const gauge = p.group.getObjectByName("lifeGauge");
                if (gauge) {
                    for (let i = 0; i < 3; i++) { gauge.children[i].visible = (i < data.lives); }
                }
            }
        }
    }
});

// 🌟 좀비 치료 시 캐릭터 재생성 (회색 텍스처는 되돌릴 수 없어 새로 만듦 — 위치·방향 유지)
function reviveLocalCharacter() {
    if (!characterGroup || !scene) return;
    const pos = characterGroup.position.clone();
    const rotY = characterGroup.rotation.y;
    scene.remove(characterGroup);
    characterGroup = buildSteveCharacter(steveName, isEasterEgg);
    characterGroup.position.copy(pos);
    characterGroup.rotation.y = rotY;
    scene.add(characterGroup);
    localParts = collectParts(characterGroup);
    updateLifeGaugeVisibility();
}
function reviveRemoteCharacter(id, p) {
    if (!p || !p.group || !scene) return;
    const pos = p.group.position.clone();
    const rotY = p.group.rotation.y;
    scene.remove(p.group);
    const g = buildSteveCharacter(p.name || 'Steve', !!p.isJjonji, p.outfit);
    g.position.copy(pos);
    g.rotation.y = rotY;
    scene.add(g);
    p.group = g;
    p.isZombie = false;
    p.parts = collectParts(g);
    updateLifeGaugeVisibility();
}

// 🌟 재입장 확정: 서버가 자신의 복원 상태(좀비 여부·남은 생명·마지막 위치)를 본인에게 알려줌
//    (player-joined 브로드캐스트는 본인 제외라, 재입장자는 이 이벤트 없으면 자신이 좀비인지 모름)
socket.on('join-accepted', (data) => {
    if (!data || data.id !== socket.id || !data.player) return;
    const wasReconnectRestore = isReconnectRestore;
    // 🌟 입장 확정 → 접속번호를 기기에 저장 (다음 입장·재연결에 자동 사용)
    try { if (joinedCode) localStorage.setItem('ksmsAccessCode', joinedCode); } catch (e) {}
    const p = data.player;
    if (p.isZombie) {
        myIsZombie = true;
        if (characterGroup) {
            zombifyCharacter(characterGroup);
            const gauge = characterGroup.getObjectByName("lifeGauge");
            if (gauge) gauge.visible = false;
        }
    } else if (characterGroup) {
        const gauge = characterGroup.getObjectByName("lifeGauge");
        if (gauge) for (let i = 0; i < 3; i++) gauge.children[i].visible = (i < (p.lives || 0));
    }
if (charPhysics && typeof p.x === 'number') {
        // 🌟 재연결 복원인 경우 로컬 위치 유지(끊긴 동안 계속 움직였으므로) — 이후 이동 패킷이 서버 위치를 즉시 갱신
        if (!isReconnectRestore) {
            charPhysics.position.set(p.x, p.y, p.z);
            charPhysics.velocity.set(0, 0, 0);
            if (characterGroup && Number.isFinite(p.rotY)) {
                characterGroup.rotation.y = p.rotY; // 🌟 방향도 복원 (없으면 매 새로고침마다 최초 방향으로 리셋됨)
                lastSentRotY = p.rotY;
            }
            liftCharacterOutOfBlocks(); // 🌟 서버에서 지정한 좌표에 블록이 있으면 즉시 블록 위로 안전 이동
        }
        charPhysics.isCrawling = !!p.isCrawling;
        isReconnectRestore = false;
        joinPositioned = true; // 서버 좌표 확정 (적용 또는 유효 로컬 확인) — 이후 방송 허용
    }
    // 🌟 재입장 진단: 적용 여부+로컬/서버 좌표를 서버 로그로 보고 (원인 확정용, 서버 REJOIN_DEBUG가 꺼져 있으면 무시됨)
    try {
        socket.emit('debug-rejoin', {
            applied: !wasReconnectRestore,
            local: charPhysics ? { x: +charPhysics.position.x.toFixed(2), y: +charPhysics.position.y.toFixed(2), z: +charPhysics.position.z.toFixed(2) } : null,
            server: { x: p.x, y: p.y, z: p.z }
        });
    } catch (e) {}
});

// 🌟 접속번호 불일치: 새로고침 없이 번호만 다시 입력 (게임화면 진입 전으로 복귀)
socket.on('code-rejected', () => {
    tryEnterGame.entered = false;
    document.getElementById('setup-modal').classList.remove('hidden');
    document.getElementById('game-container').classList.add('hidden');
    const codeInput = document.getElementById('accesscode-input');
    if (codeInput) {
        codeInput.classList.add('border-rose-500');
        codeInput.focus();
        codeInput.select();
    }
});

// 🌟 전체 소환: 관리자가 소환 버튼을 누르면 서버가 보낸 좌표로 강제 이동
socket.on('force-teleport', (data) => {
    if (!data || typeof data.x !== 'number' || typeof data.y !== 'number' || typeof data.z !== 'number') return;
    if (!isEngineInitialized || !charPhysics) return;
    charPhysics.position.set(data.x, data.y, data.z);
    charPhysics.velocity.set(0, 0, 0);
    if (characterGroup) characterGroup.position.copy(charPhysics.position);
    joinPositioned = true; // 강제 이동 좌표 확정 — 이후 방송 허용
    liftCharacterOutOfBlocks(); // 🌟 소환 지점에 블록이 겹치면 블록 위로 안전 이동
    showToast("📍 관리자가 소환했습니다!");
    // 🌟 [P0-3] 서버 summon-batch로 전파되므로 즉시 재방출 생략 — 300ms 조용 구간 + 송신 상태 동기화
    teleportQuietUntil = Date.now();
    lastSentPos.copy(charPhysics.position);
    if (characterGroup) lastSentRotY = characterGroup.rotation.y;
    lastSentCrawl = charPhysics.isCrawling;
    lastEmitTime = Date.now();
});

function handleJumpTrigger() {
    if (freezeAll && !isEasterEgg) return; // 🌟 전체 동결 중 일반 접속자 점프 불가 (쫀지는 항상 가능)
    if (!isEasterEgg && charPhysics.isGrounded) {
        charPhysics.velocity.y = 0.14; charPhysics.isGrounded = false;
    }
}

function setupTouchControls() {
    const joystick = document.getElementById('mobile-joystick');
    const knob = document.getElementById('joystick-knob');
    let isJoyDragging = false;
    
    const handleStart = (clientX, clientY) => {
        isJoyDragging = true; touchActive = true;
        if (controls) { controls.enableZoom = false; controls.enablePan = false; }
        const rect = joystick.getBoundingClientRect();
        joystickStart.x = clientX - (rect.left + rect.width / 2);
        joystickStart.y = clientY - (rect.top + rect.height / 2);
    };
    
    const handleMove = (clientX, clientY) => {
        if (!isJoyDragging) return;
        const rect = joystick.getBoundingClientRect();
        const curX = clientX - (rect.left + rect.width / 2), curY = clientY - (rect.top + rect.height / 2);
        let dx = curX - joystickStart.x, dy = curY - joystickStart.y;
        const maxDist = 48, dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        joystickDir.x = dx / maxDist; joystickDir.y = -dy / maxDist;
    };
    
    const handleEnd = () => {
        isJoyDragging = false; touchActive = false;
        if (controls) { controls.enableZoom = true; controls.enablePan = true; }
        knob.style.transform = `translate(0px, 0px)`; joystickDir.x = 0; joystickDir.y = 0;
    };
    
    joystick.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); joystick.setPointerCapture(e.pointerId); handleStart(e.clientX, e.clientY); });
    joystick.addEventListener('pointermove', (e) => { if (!isJoyDragging) return; e.stopPropagation(); e.preventDefault(); handleMove(e.clientX, e.clientY); });
    const onPointerUp = (e) => { if (!isJoyDragging) return; e.stopPropagation(); e.preventDefault(); try { if (joystick.hasPointerCapture(e.pointerId)) joystick.releasePointerCapture(e.pointerId); } catch (_) {} handleEnd(); };
    joystick.addEventListener('pointerup', onPointerUp); joystick.addEventListener('pointercancel', onPointerUp);
    // 🌟 조이스틱 stuck 방지: 캡처 상실(시스템 제스처·멀티터치 끊김) 시에도 반드시 리셋 — 안 하면 touchActive가 true로 남아 계속 걸어감
    joystick.addEventListener('lostpointercapture', () => { if (isJoyDragging) handleEnd(); });
    // 🌟 창 포커스 상실(알림·멀티태스킹 전환) 시 조이스틱 상태 리셋
    window.addEventListener('blur', () => { handleEnd(); });
    
    const jumpBtn = document.getElementById('mobile-jump-btn');
    jumpBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); keys.flyUp = true; handleJumpTrigger(); });
    const resetJump = (e) => { e.stopPropagation(); e.preventDefault(); keys.flyUp = false; };
    jumpBtn.addEventListener('pointerup', resetJump); jumpBtn.addEventListener('pointercancel', resetJump); jumpBtn.addEventListener('pointerleave', resetJump);
    
    const crouchBtn = document.getElementById('mobile-crouch-btn');
    crouchBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); keys.flyDown = true; });
    const resetCrouch = (e) => { e.stopPropagation(); e.preventDefault(); keys.flyDown = false; };
    crouchBtn.addEventListener('pointerup', resetCrouch); crouchBtn.addEventListener('pointercancel', resetCrouch); crouchBtn.addEventListener('pointerleave', resetCrouch);
}

function selectHotbar(index) {
    activeHotbarIndex = index;
    const slots = document.querySelectorAll('.hotbar-slot');
    slots.forEach(slot => slot.classList.remove('active'));
    
    const activeSlot = document.querySelector(`.hotbar-slot[data-index="${index}"]`);
    if (activeSlot) {
        activeSlot.classList.add('active');
        if (activeSlot.getAttribute('data-type') === 'eraser') {
            selectedToolType = 'eraser';
        } else {
            selectedToolType = 'block'; selectedColor = activeSlot.getAttribute('data-value');
        }
    }
}

function setupEventListeners() {
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeMediaModal(); return; } // 🌟 미디어 팝업 닫기
        // 🌟 입력창(URL 등)에 타이핑 중이면 게임 단축키 무시
        //    단 줌 슬라이더는 키보드와 분리: 포커스가 남아 있어도 방향키는 캐릭터 이동, 슬라이더 값은 안 변함
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
            if (e.target.id !== 'zoom-slider') return;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) { e.preventDefault(); e.target.blur(); }
        }
        // 🌟 미디어 팝업이 열려 있으면 이동·점프·단축키 입력 무시 (닫은 뒤 정상 재개)
        if (isMediaModalOpen()) return;
        const key = e.key.toLowerCase();
        if (key === 'w' || e.key === 'ArrowUp') keys.w = true;
        if (key === 's' || e.key === 'ArrowDown') keys.s = true;
        if (key === 'a' || e.key === 'ArrowLeft') keys.a = true;
        if (key === 'd' || e.key === 'ArrowRight') keys.d = true;
        if (e.key === ' ') { keys.flyUp = true; handleJumpTrigger(); e.preventDefault(); }
        if (e.key === 'Shift') { keys.flyDown = true; e.preventDefault(); }
        if (/[1-9]/.test(e.key)) selectHotbar(parseInt(e.key) - 1);
        else if (e.key === '0') selectHotbar(9);
        else if (e.key === '-' || e.key === '_') selectHotbar(10);
        else if (e.key === '=' || e.key === '+') selectHotbar(12);
    });
    
    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || e.key === 'ArrowUp') keys.w = false;
        if (key === 's' || e.key === 'ArrowDown') keys.s = false;
        if (key === 'a' || e.key === 'ArrowLeft') keys.a = false;
        if (key === 'd' || e.key === 'ArrowRight') keys.d = false;
        if (e.key === ' ') keys.flyUp = false;
        if (e.key === 'Shift') keys.flyDown = false;
    });

    // 🌟 키 stuck 방지: 창 포커스를 잃으면(Alt+Tab·전체화면 전환·개발자도구 클릭 등) keyup이 씹혀
    //    keys.* 가 true로 영구히 남아 손을 떼도 한 방향으로 계속 걸어감 — blur/백그라운드 시 전체 리셋
    const resetStuckInputs = () => {
        keys.w = keys.a = keys.s = keys.d = false;
        keys.flyUp = keys.flyDown = false;
        touchActive = false; joystickDir.x = 0; joystickDir.y = 0;
        const knob = document.getElementById('joystick-knob');
        if (knob) knob.style.transform = 'translate(0px, 0px)';
    };
    window.addEventListener('blur', resetStuckInputs);
    document.addEventListener('visibilitychange', () => { if (document.hidden) resetStuckInputs(); });

    const canvas = document.getElementById('game-canvas');
    let isPointerActive = false, pointerStartX = 0, pointerStartY = 0, pointerMoved = false;
    let isTouchRotating = false, touchRotateStartX = 0, touchRotateStartY = 0, activeRotatePointerId = null;
    
    canvas.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        isPointerActive = true; pointerMoved = false;
        pointerStartX = e.clientX; pointerStartY = e.clientY;
        if (e.pointerType === 'touch' && activeRotatePointerId === null) {
            activeRotatePointerId = e.pointerId; isTouchRotating = true;
            touchRotateStartX = e.clientX; touchRotateStartY = e.clientY;
            controls.enabled = false;
        }
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!isPointerActive) return;
        const dx = e.clientX - pointerStartX, dy = e.clientY - pointerStartY;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) pointerMoved = true;

        if (isTouchRotating && e.pointerType === 'touch' && e.pointerId === activeRotatePointerId) {
            const deltaX = e.clientX - touchRotateStartX, deltaY = e.clientY - touchRotateStartY;
            touchRotateStartX = e.clientX; touchRotateStartY = e.clientY;
            const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
            const spherical = new THREE.Spherical().setFromVector3(offset);
            spherical.theta -= deltaX * 0.005; spherical.phi -= deltaY * 0.005;
            spherical.phi = Math.max(controls.minPolarAngle, Math.min(controls.maxPolarAngle, spherical.phi));
            spherical.makeSafe(); offset.setFromSpherical(spherical);
            camera.position.copy(controls.target).add(offset); camera.lookAt(controls.target);
        }
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    
    const endTouchRotation = (e) => {
        if (e && e.pointerId !== activeRotatePointerId) return;
        isPointerActive = false; if (isTouchRotating) { isTouchRotating = false; controls.enabled = true; }
        activeRotatePointerId = null;
    };

    canvas.addEventListener('pointerup', (e) => {
        if (!isPointerActive) return;
        const isTarget = (e.pointerId === activeRotatePointerId); endTouchRotation(e);
        if (!pointerMoved && (e.pointerType === 'mouse' || isTarget)) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1; 
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const playerGroups = Array.from(remotePlayers.values()).map(p => p.group);
            const playerIntersects = raycaster.intersectObjects(playerGroups, true);
            
            if (playerIntersects.length > 0) {
                let hitObject = playerIntersects[0].object;
                let targetPlayerId = null;
                
                for (const [id, p] of remotePlayers.entries()) {
                    let current = hitObject;
                    while(current) {
                        if (current === p.group) { targetPlayerId = id; break; }
                        current = current.parent;
                    }
                    if (targetPlayerId) break;
                }
                
                if (targetPlayerId) {
                    const targetPlayer = remotePlayers.get(targetPlayerId);
                    // 🌟 쫀지(무적)와 좀비(피격 불가)는 공격 대상에서 제외 — 서버 거부 + 유령 소리 방지
                    if (targetPlayer.isJjonji || targetPlayer.isZombie) return;
                    if (freezeAll && !isEasterEgg) return; // 🌟 전체 동결 중 일반 접속자 공격 불가 (쫀지는 항상 가능)
                    const distToTarget = characterGroup.position.distanceTo(targetPlayer.group.position);
                    
                    if (globalMode === 'ATTACK') {
                        if (isEasterEgg || distToTarget <= 5.0) {
                            // 🌟 벽 관통 차단: 2칸 이상 벽 뒤는 공격 불가 (서 있으면 1칸 벽 너머 가능)
                            if (!isEasterEgg && isWallBetweenEyes(targetPlayer)) {
                                showToast("🧱 벽에 막혀 공격할 수 없습니다");
                                return;
                            }
                            socket.emit('player-attack', { targetId: targetPlayerId });
                            sfx.playHit(); // 🌟 공격 효과음은 공격자 화면에서만
                        }
                    }
                    return; 
                }
            }
            
            handleInteract();
        }
    });

    canvas.addEventListener('pointercancel', endTouchRotation); canvas.addEventListener('pointerleave', endTouchRotation);

    const uiContainers = [
        document.getElementById('mobile-joystick'), document.getElementById('mobile-jump-btn'),
        document.getElementById('mobile-crouch-btn'), document.getElementById('hotbar-container'),
        document.getElementById('fullscreen-btn'), document.getElementById('capture-btn'),
        document.getElementById('photo-btn'), document.getElementById('save-btn'),
        document.getElementById('load-btn'), document.getElementById('zoom-slider'),
        document.getElementById('view-toggle-btn'), document.getElementById('admin-mode-controls'),
        document.getElementById('quality-btn'), document.getElementById('summon-all-btn'),
        document.getElementById('freeze-all-btn')
    ];
    uiContainers.forEach(el => {
        if (el) {
            el.addEventListener('pointerdown', e => e.stopPropagation()); el.addEventListener('pointerup', e => e.stopPropagation());
            el.addEventListener('pointermove', e => e.stopPropagation()); el.addEventListener('touchmove', e => e.stopPropagation(), { passive: true });
        }
    });

    document.querySelectorAll('.hotbar-slot').forEach(slot => { slot.addEventListener('click', (e) => { e.stopPropagation(); selectHotbar(parseInt(slot.getAttribute('data-index'))); }); });

    const zoomSlider = document.getElementById('zoom-slider');
    zoomSlider.addEventListener('input', (e) => {
        const targetDist = 19 - parseFloat(e.target.value);
        const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
        camera.position.copy(controls.target).addScaledVector(dir, targetDist);
        controls.update();
    });
    zoomSlider.addEventListener('change', (e) => { e.target.blur(); }); // 드래그 끝나면 포커스 해제 (방향키가 캐릭터로 돌아감)

    // 🌟 iPad 더블탭 확대 차단: 상단바에서 350ms 내 두 번째 터치의 기본 동작(페이지 줌)만 차단 (단일 탭 클릭은 정상)
    let lastTopBarTouchEnd = 0;
    const topBarEl = document.getElementById('top-bar');
    if (topBarEl) topBarEl.addEventListener('touchend', (e) => {
        const nowMs = Date.now();
        if (nowMs - lastTopBarTouchEnd < 350) e.preventDefault();
        lastTopBarTouchEnd = nowMs;
    }, { passive: false });

    document.getElementById('view-toggle-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        isFirstPerson = !isFirstPerson;
        characterGroup.visible = !isFirstPerson; 
        
        const icon = document.getElementById('view-toggle-icon');
        if (isFirstPerson) {
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
            controls.minDistance = 0.01;
            controls.maxDistance = 0.01;
            controls.minPolarAngle = Math.PI * (1 / 180); 
            controls.maxPolarAngle = Math.PI * (179 / 180); 
            zoomSlider.disabled = true;
            zoomSlider.parentElement.style.opacity = '0.5';
            
            const rotY = characterGroup.rotation.y;
            const forward = new THREE.Vector3(Math.sin(rotY), 0, Math.cos(rotY)).normalize();
            
            const targetYOffset = lerp(1.5, 0.45, charPhysics.crawlProgress);
            const absoluteTarget = charPhysics.position.clone().add(new THREE.Vector3(0, targetYOffset, 0));
            
            controls.target.copy(absoluteTarget);
            camera.position.copy(absoluteTarget).addScaledVector(forward, -0.01);
            controls.update();
        } else {
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
            controls.minDistance = 4;
            controls.maxDistance = 15;
            controls.minPolarAngle = Math.PI * (1 / 180);
            controls.maxPolarAngle = Math.PI * (75 / 180); 
            zoomSlider.disabled = false;
            zoomSlider.parentElement.style.opacity = '1';
            
            const targetDist = 19 - parseFloat(zoomSlider.value);
            
            const rotY = characterGroup.rotation.y;
            const dir = new THREE.Vector3(-Math.sin(rotY), 0.3, -Math.cos(rotY)).normalize();
            
            const targetYOffset = 1.0;
            const absoluteTarget = charPhysics.position.clone().add(new THREE.Vector3(0, targetYOffset, 0));
            
            controls.target.copy(absoluteTarget);
            camera.position.copy(absoluteTarget).addScaledVector(dir, targetDist);
            controls.update(); 
        }
    });

    // 🌟 [쫀지 전용] 투명인간(블록 통과) 버튼 이벤트 리스너
    const ghostBtn = document.getElementById('ghost-toggle-btn');
    if (ghostBtn) {
        ghostBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            ghostMode = !ghostMode;
            if (ghostMode) {
                ghostBtn.classList.remove('bg-rose-950/40', 'text-rose-200', 'border-rose-900/30');
                ghostBtn.classList.add('bg-cyan-600', 'text-white', 'border-cyan-400', 'shadow-[0_0_12px_rgba(6,182,212,0.8)]');
                showToast("👻 투명인간 모드 활성화 (블록 통과)");
            } else {
                ghostBtn.classList.add('bg-rose-950/40', 'text-rose-200', 'border-rose-900/30');
                ghostBtn.classList.remove('bg-cyan-600', 'text-white', 'border-cyan-400', 'shadow-[0_0_12px_rgba(6,182,212,0.8)]');
                showToast("🚶 일반 모드 (블록 통과 불가)");
            }
        });
    }

    // 🌟 [쫀지 전용] 전체 소환: 모든 접속자를 관리자 캐릭터 위치로 강제소환
    const summonBtn = document.getElementById('summon-all-btn');
    if (summonBtn) {
        summonBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isEasterEgg || !isEngineInitialized) return;
            socket.emit('admin-summon-all', {
                x: charPhysics.position.x,
                y: charPhysics.position.y,
                z: charPhysics.position.z
            });
            showToast("📍 모든 접속자를 소환했습니다");
        });
    }

    // 🌟 [쫀지 전용] 전체 동결/해제: 버튼을 누르면 모든 일반 접속자 조종 불가
    const freezeBtn = document.getElementById('freeze-all-btn');
    if (freezeBtn) {
        freezeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isEasterEgg || !isEngineInitialized) return;
            socket.emit('admin-toggle-freeze');
        });
    }

    document.querySelectorAll('.admin-mode-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const mode = btn.getAttribute('data-mode');
            socket.emit('change-mode', mode);
        });
    });

    document.getElementById('quality-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        const next = (currentQuality === 'HIGH') ? 'MID' : (currentQuality === 'MID' ? 'LOW' : 'HIGH');
        applyQuality(next);
        const toast = document.getElementById('toast');
        if (toast) { toast.textContent = `화질: ${QUALITY_LABELS[next]}`; toast.classList.remove('opacity-0'); setTimeout(() => toast.classList.add('opacity-0'), 1200); }
    });

    document.getElementById('save-btn').addEventListener('click', e => { e.stopPropagation(); saveWorldToFile(); });
    const loadBtn = document.getElementById('load-btn'), fInput = document.getElementById('file-input');
    loadBtn.addEventListener('click', e => { e.stopPropagation(); fInput.click(); }); fInput.addEventListener('change', loadWorldFromFile);

    document.getElementById('capture-btn').addEventListener('click', (e) => {
        e.stopPropagation(); renderer.render(scene, camera);
        const now = new Date(), yy = String(now.getFullYear()).slice(-2), mm = String(now.getMonth() + 1).padStart(2, '0'), dd = String(now.getDate()).padStart(2, '0'), hh = String(now.getHours()).padStart(2, '0'), min = String(now.getMinutes()).padStart(2, '0'), ss = String(now.getSeconds()).padStart(2, '0');
        const link = document.createElement('a'); link.href = renderer.domElement.toDataURL('image/png'); link.download = `KSMS-${yy}${mm}${dd}-${hh}${min}${ss}.png`; link.click();
    });

    document.getElementById('photo-btn').addEventListener('click', (e) => {
        e.stopPropagation(); renderer.render(scene, camera);
        const newTab = window.open();
        if (newTab) {
            newTab.document.write(`<html><body style="margin:0; background:#000; display:flex; align-items:center; justify-content:center; height:100vh;"><img src="${renderer.domElement.toDataURL('image/png')}" style="max-width:100%; max-height:100%;"/></body></html>`);
            newTab.document.close();
        }
    });

    const fsBtn = document.getElementById('fullscreen-btn');
    fsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().then(() => { fsBtn.innerHTML = '<i class="fa-solid fa-compress text-sm"></i>'; });
        } else {
            document.exitFullscreen().then(() => { fsBtn.innerHTML = '<i class="fa-solid fa-expand text-sm"></i>'; });
        }
    });
    // 입장 시 자동 전체화면 등 프로그램에 의한 전환에도 버튼 아이콘을 동기화
    document.addEventListener('fullscreenchange', () => {
        fsBtn.innerHTML = document.fullscreenElement
            ? '<i class="fa-solid fa-compress text-sm"></i>'
            : '<i class="fa-solid fa-expand text-sm"></i>';
    });
    window.addEventListener('resize', onWindowResize);
}

function onWindowResize() {
    const width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    camera.aspect = width / height; camera.updateProjectionMatrix(); renderer.setSize(width, height);
}

function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

function updatePhysics() {
    if (!isEngineInitialized) return;
    // 🌟 미디어 팝업이 열려 있으면 캐릭터 완전 정지 (이동·점프·중력·트랩 판정 모두 중단, 닫으면 즉시 재개)
    if (isMediaModalOpen()) return;
    prevCharPos.copy(charPhysics.position);
    const now = Date.now();
    
    if (isEasterEgg) {
        charPhysics.velocity.y = 0; charPhysics.isGrounded = false;
        
        let vMove = 0;
        if (keys.flyUp) vMove = 0.08;
        else if (keys.flyDown) vMove = -0.08;
        
        let tY = charPhysics.position.y + vMove;
        if (tY < 0.0) { tY = 0.0; }
        // 🌟 [쫀지] 투명인간 모드가 꺼져 있으면 블록과 충돌하여 Y 이동이 막힘
        if (!ghostMode && checkCollision(charPhysics.position.x, tY, charPhysics.position.z)) {
            tY = charPhysics.position.y;
        }
        charPhysics.position.y = tY;
        
        // 🌟 [쫀지] 발밑(바닥 또는 블록 위) 접지 판정
        const isOnGround = (charPhysics.position.y <= 0.01) || (!ghostMode && checkCollision(charPhysics.position.x, charPhysics.position.y - 0.1, charPhysics.position.z, false));
        
        if (!ghostMode) {
            // 🌟 머리 위 천장이 막혀 일어설 수 없으면 기어가기 강제 유지
            const cannotStandUp = checkCollision(charPhysics.position.x, charPhysics.position.y, charPhysics.position.z, false);
            if (keys.flyDown && isOnGround || cannotStandUp) {
                charPhysics.isCrawling = true;
            } else {
                charPhysics.isCrawling = false;
            }
        } else {
            // 투명인간 켜짐: 블록을 자유 통과하므로 잔디 바닥에서만 기어가기
            charPhysics.isCrawling = (charPhysics.position.y <= 0.01 && keys.flyDown);
        }
    } else {
        const isFreeFly = (globalMode === 'FLIGHT'); 
        const movementFrozen = (freezeAll && !isEasterEgg); // 🌟 전체 동결 중 일반 접속자 상하 이동 입력 무시 (쫀지는 위 분기라 영향 없음)

        if (isFreeFly) {
            charPhysics.velocity.y = 0; charPhysics.isGrounded = false;
            let vMove = 0;
            if (!movementFrozen) {
                if (keys.flyUp) vMove = 0.08;
                else if (keys.flyDown) vMove = -0.08;
            }

            if (vMove !== 0) {
                let tY = charPhysics.position.y + vMove;
                if (tY < 0.0) { 
                    tY = 0.0; charPhysics.isGrounded = true; 
                } else if (checkCollision(charPhysics.position.x, tY, charPhysics.position.z, null, 0.02)) {
                    tY = charPhysics.position.y;
                }
                charPhysics.position.y = tY;
            }
            
            const isOnGround = (charPhysics.position.y <= 0.01) || checkCollision(charPhysics.position.x, charPhysics.position.y - 0.1, charPhysics.position.z, false);
            const cannotStandUp = checkCollision(charPhysics.position.x, charPhysics.position.y, charPhysics.position.z, false);
            
            if (keys.flyDown && isOnGround || cannotStandUp) {
                charPhysics.isCrawling = true;
            } else {
                charPhysics.isCrawling = false;
            }
        } else {
            // 🌟 [일반 중력 모드] 머리 위 천장 블록이 있으면 일어서지 못하고 기어가기 강제 유지!
            const cannotStandUp = checkCollision(charPhysics.position.x, charPhysics.position.y, charPhysics.position.z, false);
            charPhysics.isCrawling = (!movementFrozen && keys.flyDown || cannotStandUp);

            if (movementFrozen) {
                // 🌟 동결 중에는 공중에 멈춤 (중력 낙하 없음) — 해제하면 그 자리에서 이어짐
                charPhysics.velocity.set(0, 0, 0);
            } else {
                charPhysics.velocity.y -= charPhysics.gravity;
                if (charPhysics.velocity.y < -0.35) charPhysics.velocity.y = -0.35; // 낙하 종속도 (무한 가속·바닥 터널링 차단)
                let tY = charPhysics.position.y + charPhysics.velocity.y;

                if (tY < 0.0) {
                    tY = 0.0; charPhysics.velocity.y = 0; charPhysics.isGrounded = true;
                } else {
                    if (charPhysics.velocity.y < 0 && checkCollision(charPhysics.position.x, tY, charPhysics.position.z, null, 0.02)) {
                        tY = Math.floor(charPhysics.position.y); charPhysics.velocity.y = 0; charPhysics.isGrounded = true;
                    } else if (charPhysics.velocity.y > 0 && checkCollision(charPhysics.position.x, tY, charPhysics.position.z, null, 0.02)) {
                        charPhysics.velocity.y = 0; tY = charPhysics.position.y;
                    } else charPhysics.isGrounded = false;
                }
                charPhysics.position.y = tY;
            }
        }

        if (charPhysics.position.y > 61.0) {
            charPhysics.position.y = 61.0;
            if (charPhysics.velocity.y > 0) charPhysics.velocity.y = 0;
        }
    }

    let moveX = 0, moveZ = 0;
    if (!(freezeAll && !isEasterEgg)) { if (keys.w) moveZ -= 1; if (keys.s) moveZ += 1; if (keys.a) moveX -= 1; if (keys.d) moveX += 1; if (touchActive) { moveX = joystickDir.x; moveZ = -joystickDir.y; } }

    const moveVector = tmpMove.set(moveX, 0, moveZ);
    let isMoving = moveVector.lengthSq() > 0;
    
    if (isMoving) {
        moveVector.normalize();
        const camDir = tmpCamDir; camera.getWorldDirection(camDir); camDir.y = 0;
        if (camDir.lengthSq() < 0.0001) camDir.set(0, 0, -1); else camDir.normalize();
        const camRight = tmpCamRight.crossVectors(camera.up, camDir).normalize().negate();
        const finalDir = tmpFinalDir.addScaledVector(camDir, -moveZ).addScaledVector(camRight, moveX).normalize();
        
        const speed = charPhysics.isCrawling ? charPhysics.speed * 0.5 : charPhysics.speed;
        const targetX = charPhysics.position.x + finalDir.x * speed;
        const targetZ = charPhysics.position.z + finalDir.z * speed;
        
        if (!checkCollision(targetX, charPhysics.position.y, charPhysics.position.z)) charPhysics.position.x = targetX;
        if (!checkCollision(charPhysics.position.x, charPhysics.position.y, targetZ)) charPhysics.position.z = targetZ;
        
        characterGroup.rotation.y = Math.atan2(finalDir.x, finalDir.z);
    }
    
    const edgeLimit = FLOOR_SIZE / 2 - 1;
    if (charPhysics.position.x > edgeLimit) charPhysics.position.x = edgeLimit;
    if (charPhysics.position.x < -edgeLimit) charPhysics.position.x = -edgeLimit;
    if (charPhysics.position.z > edgeLimit) charPhysics.position.z = edgeLimit;
    if (charPhysics.position.z < -edgeLimit) charPhysics.position.z = -edgeLimit;
    
    characterGroup.position.copy(charPhysics.position);
    
    // 🌟 큐브블록 트랩: 안전모드/공격모드에서만, 일반(좀비 아님) 플레이어만 발동 — 축하음은 서버 이벤트로 전원 재생
    // 🌟 [C안 ⑤] 큐브블록이 맵에 없으면 매 프레임 240칸 트랩 스캔을 통째로 생략
    // 🌟 전체 동결 중에는 일반 접속자 트랩 발동도 차단 (쫀지는 원래 트랩 면역)
    if (pinkBlockCount > 0 && !isEasterEgg && !freezeAll && !myIsZombie && (globalMode === 'SAFE' || globalMode === 'ATTACK') && checkPinkBlockCollision(charPhysics.position.x, charPhysics.position.y, charPhysics.position.z)) {
        if (!lastPinkCollided) { socket.emit('trigger-pink-collision'); lastPinkCollided = true; }
    } else { lastPinkCollided = false; }
    
    if (sunLight && characterGroup) {
        sunLight.position.set(charPhysics.position.x + 30, charPhysics.position.y + 60, charPhysics.position.z + 15);
        sunLight.target = characterGroup;
    }
    
    // 🌟 [P0-1] 틱 슬리밍: 움직임 있을 때만 10Hz, 정지 시 500ms heartbeat (20Hz 상시 → 약 1/20)
    const sentDX = charPhysics.position.x - lastSentPos.x;
    const sentDY = charPhysics.position.y - lastSentPos.y;
    const sentDZ = charPhysics.position.z - lastSentPos.z;
    const sentDR = characterGroup ? Math.abs(characterGroup.rotation.y - lastSentRotY) : 0;
    const moved = (sentDX * sentDX + sentDY * sentDY + sentDZ * sentDZ) > 0.0025
        || sentDR > 0.02 || (charPhysics.isCrawling !== lastSentCrawl);
    if (worldReady && joinPositioned && now - lastEmitTime > (moved ? 100 : 500)) {
        if (now < teleportQuietUntil) {
            // 🌟 [P0-3] 소환 직후 300ms: 서버 배치로 이미 전파됐으므로 재전송 생략 (N² 여파 차단)
        } else {
            socket.emit('player-move', { x: charPhysics.position.x, y: charPhysics.position.y, z: charPhysics.position.z, rotY: characterGroup.rotation.y, isCrawling: charPhysics.isCrawling });
        }
        lastSentPos.copy(charPhysics.position);
        if (characterGroup) lastSentRotY = characterGroup.rotation.y;
        lastSentCrawl = charPhysics.isCrawling;
        lastEmitTime = now;
    }
    
    const cp = charPhysics.crawlProgress = lerp(charPhysics.crawlProgress, charPhysics.isCrawling ? 1.0 : 0.0, 0.15);
    // 🌟 [C안 ②] 부위 참조 캐싱 — getObjectByName(씬 트리 순회) 8회/프레임 제거
    const P = localParts || {};
    const head = P.head, torso = P.torso,
          lL = P.lL, rL = P.rL,
          lA = P.lA, rA = P.rA,
          np = P.np,
          lifeGauge = P.lifeGauge;
          
    let swing = isMoving ? Math.sin(now * 0.012) * 0.5 : 0;
    const crawlSwing = swing * lerp(1.0, 0.5, cp); 

    if (torso && head && lL && rL && lA && rA) {
        torso.scale.set(1, lerp(1.0, 0.5, cp), 1);
        torso.position.y = lerp(0.7, 0.22, cp); torso.position.z = lerp(0, -0.1, cp); torso.rotation.x = lerp(0, Math.PI / 2, cp);
        
        head.position.y = lerp(1.5, 0.45, cp); head.position.z = lerp(0, 0.4, cp); head.rotation.x = lerp(0, -Math.PI / 12, cp);
        
        lL.scale.set(1, lerp(1.0, 0.5, cp), 1); rL.scale.set(1, lerp(1.0, 0.5, cp), 1);
        lL.position.y = lerp(0.4, 0.22, cp); rL.position.y = lerp(0.4, 0.22, cp);
        lL.position.z = lerp(0, -0.15, cp); rL.position.z = lerp(0, -0.15, cp);
        
        lA.position.y = lerp(1.0, 0.22, cp); rA.position.y = lerp(1.0, 0.22, cp);
        lA.position.z = lerp(0, 0.35, cp); rA.position.z = lerp(0, 0.35, cp);
        
        if (np) { np.position.y = lerp(2.6, 1.2, cp); np.position.z = lerp(0, 0.4, cp); np.quaternion.copy(camera.quaternion); }
        
        if (lifeGauge) { 
            lifeGauge.position.y = lerp(2.2, 1.0, cp); 
            lifeGauge.position.z = lerp(0, 0.4, cp); 
            lifeGauge.quaternion.copy(characterGroup.quaternion).invert().multiply(camera.quaternion); 
        }

        lL.rotation.x = lerp(0, Math.PI / 2, cp) + crawlSwing;
        rL.rotation.x = lerp(0, Math.PI / 2, cp) - crawlSwing;
        lA.rotation.x = lerp(0, -Math.PI / 2, cp) - crawlSwing;
        rA.rotation.x = lerp(0, -Math.PI / 2, cp) + crawlSwing;
    }
    
    remotePlayers.forEach((p, id) => {
        p.group.position.lerp(p.target, 0.2); // 🌟 [C안 ④] 50ms 동기화 주기에 맞춘 보간 보정
        const P = p.parts || {};

        // 🌟 [C안 ③] '저' 화질 + 12칸 밖 먼 캐릭터: 포즈·팔다리 계산 생략 (위치·이름표만 갱신)
        if ((currentQuality === 'LOW') && (camera.position.distanceToSquared(p.group.position) > 144)) {
            if (P.np) P.np.quaternion.copy(camera.quaternion);
            return;
        }

        const rcp = p.crawlProgress = lerp(p.crawlProgress, p.isCrawling ? 1.0 : 0.0, 0.15);
        
        const dist = p.group.position.distanceTo(p.target);
        const isRemoteMoving = dist > 0.02;
        let rSwing = isRemoteMoving ? Math.sin(now * 0.012) * 0.5 : 0;
        const rCrawlSwing = rSwing * lerp(1.0, 0.5, rcp);

        const rHead = P.head, rTorso = P.torso,
              rL_L = P.lL, rR_L = P.rL,
              rL_A = P.lA, rR_A = P.rA,
              rNp = P.np,
              rLifeGauge = P.lifeGauge;
              
        if (rTorso && rHead && rL_L && rR_L && rL_A && rR_A) {
            rTorso.scale.set(1, lerp(1.0, 0.5, rcp), 1);
            rTorso.position.y = lerp(0.7, 0.22, rcp); rTorso.position.z = lerp(0, -0.1, rcp); rTorso.rotation.x = lerp(0, Math.PI / 2, rcp);
            
            rHead.position.y = lerp(1.5, 0.45, rcp); rHead.position.z = lerp(0, 0.4, rcp); rHead.rotation.x = lerp(0, -Math.PI / 12, rcp);
            
            rL_L.scale.set(1, lerp(1.0, 0.5, rcp), 1); rR_L.scale.set(1, lerp(1.0, 0.5, rcp), 1);
            rL_L.position.y = lerp(0.4, 0.22, rcp); rR_L.position.y = lerp(0.4, 0.22, rcp);
            rL_L.position.z = lerp(0, -0.15, rcp); rR_L.position.z = lerp(0, -0.15, rcp);
            
            rL_A.position.y = lerp(1.0, 0.22, rcp); rR_A.position.y = lerp(1.0, 0.22, rcp);
            rL_A.position.z = lerp(0, 0.35, rcp); rR_A.position.z = lerp(0, 0.35, rcp);
            
            if (rNp) { 
                rNp.position.y = lerp(2.6, 1.2, rcp); 
                rNp.position.z = lerp(0, 0.4, rcp);
                rNp.quaternion.copy(camera.quaternion); 
            }
            
            if (rLifeGauge) {
                rLifeGauge.position.y = lerp(2.2, 1.0, rcp);
                rLifeGauge.position.z = lerp(0, 0.4, rcp);
                rLifeGauge.quaternion.copy(p.group.quaternion).invert().multiply(camera.quaternion); 
            }

            rL_L.rotation.x = lerp(0, Math.PI / 2, rcp) + rCrawlSwing;
            rR_L.rotation.x = lerp(0, Math.PI / 2, rcp) - rCrawlSwing;
            rL_A.rotation.x = lerp(0, -Math.PI / 2, rcp) - rCrawlSwing;
            rR_A.rotation.x = lerp(0, -Math.PI / 2, rcp) + rCrawlSwing;
        }
    });
    
    let targetYOffset = isFirstPerson ? lerp(1.5, 0.45, charPhysics.crawlProgress) : 1.0;
    const absoluteTarget = tmpCamTarget.copy(charPhysics.position); absoluteTarget.y += targetYOffset;
    let offset = tmpCamOffset.subVectors(camera.position, controls.target);
    if (isFirstPerson) offset.normalize().multiplyScalar(0.01);
    
    controls.target.copy(absoluteTarget); camera.position.copy(absoluteTarget).add(offset);
    
    const zSlider = document.getElementById('zoom-slider');
    if (zSlider && document.activeElement !== zSlider && !isFirstPerson) zSlider.value = Math.round(19 - offset.length());
}

let lastRenderTime = 0;
// 🌟 화질별 렌더 fps 캡 — 고 60fps, 중·저 30fps (물리·이동은 매 프레임 유지해 이동속도 불변, 렌더만 솎아 GPU 부하 절감)
function qualityFrameInterval(q) {
    return (q === 'HIGH') ? 16.7 : 33.4;
}
function animate() {
    requestAnimationFrame(animate);
    updatePhysics();
    if (controls) controls.update();
    const nowMs = performance.now();
    if (nowMs - lastRenderTime < qualityFrameInterval(currentQuality)) return;
    lastRenderTime = nowMs;
    flushDirtyBlocks(); // 🌟 증분 갱신: 프레임 내 변경 슬롯을 렌더 직전에 묶음 업로드
    if (scene && camera && renderer) renderer.render(scene, camera);
}

// iOS/iPadOS 페이지 확대(핀치줌) 차단 — iPad Chrome도 내부적으로 WebKit 엔진이라 gesture 이벤트가 발생함.
// iOS 10부터는 user-scalable=no와 touch-action:none을 무시하고 두 손가락 핀치를 페이지 확대로 적용하며,
// 확대 상태는 새로고침 후에도 탭에 유지되고 브라우저 재시작으로만 초기화되므로 이벤트 자체를 차단해야 함.
['gesturestart', 'gesturechange', 'gestureend'].forEach((name) => {
    document.addEventListener(name, (e) => e.preventDefault(), { passive: false });
});

// 브라우저별 전체화면 진입 (Chrome/Edge: 표준 API, iPad Safari: webkit 접두사 API)
function requestGameFullscreen() {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (!fn) return;
    try {
        const p = fn.call(el);
        if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch (err) {}
}

// 🌟 메타버스 접속번호: index.html과 같은 폴더의 code.txt (4자리). http로 열어야 읽힘
let metaAccessCode = null;
fetch('code.txt').then((r) => {
    if (!r.ok) throw new Error('no code file');
    return r.text();
}).then((t) => {
    const c = String(t || '').trim();
    if (/^\d{4}$/.test(c)) metaAccessCode = c;
}).catch(() => {});

function tryEnterGame() {
    const inputName = usernameInput.value.trim();
    // 🌟 이름 규칙: 한글·영문·숫자만 (공백·기호 불가)
    if (!inputName || !/^[가-힣ㄱ-ㅎㅏ-ㅣa-zA-Z0-9]+$/.test(inputName)) {
        usernameInput.classList.add('border-rose-500'); usernameInput.focus(); return;
    }
    // 🌟 중복 입장 방지: 버튼 연타·Enter 중복 시 animate 루프 2중 실행으로 이동 2배속되는 현상 차단
    if (tryEnterGame.entered) return;
    tryEnterGame.entered = true;
    
    // 메타버스: 이스터에그·저장/불러오기 없음 — 항상 일반 접속자 (안전모드 걷기+보기 전용)
    steveName = inputName; isEasterEgg = false;
    document.getElementById('ghost-toggle-btn').classList.add('hidden');
    document.getElementById('summon-all-btn').classList.add('hidden');
    document.getElementById('freeze-all-btn').classList.add('hidden');
    ghostMode = false;

    // 메타버스: 접속번호는 code.txt의 4자리와 일치해야 입장
    const codeInput = document.getElementById('accesscode-input');
    const codeVal = codeInput ? codeInput.value.trim() : '';
    if (!/^\d{4}$/.test(codeVal) || metaAccessCode === null || codeVal !== metaAccessCode) {
        if (codeInput) { codeInput.classList.add('border-rose-500'); codeInput.focus(); }
        if (metaAccessCode === null) showToast('접속번호 파일(code.txt)을 읽지 못했습니다 (http로 접속하세요)');
        tryEnterGame.entered = false;
        return;
    }
    
    sfx.init();
    joinedCode = codeVal;
    socket.emit('join-player', { name: steveName, isEasterEgg: isEasterEgg, token: playerToken, outfit: selectedOutfitId, code: joinedCode });
    // 원본 입력값을 저장 — 15분 내 자동 재입장 시 이름 복원용
    try { localStorage.setItem('ksmsPlayerSession', JSON.stringify({ name: inputName, at: Date.now() })); } catch (e) {}
    hasJoined = true; joinedName = steveName; joinedIsEasterEgg = isEasterEgg; joinedOutfitId = selectedOutfitId; // 🌟 재연결 시 자동 재입장용
    joinPositioned = false; // 입장 확정(join-accepted) 전까지 방송 중단
    
    document.getElementById('setup-modal').classList.add('hidden');
    document.getElementById('game-container').classList.remove('hidden');

    // 입장 버튼 클릭(사용자 제스처) 시점에 맞춰 자동 전체화면 진입 — 태블릿에서 브라우저 UI가 사라져 일반 게임처럼 보임
    if (!document.fullscreenElement && !document.webkitFullscreenElement) requestGameFullscreen();
    
    // 🌟 번호 거부 후 재입장 시 엔진·리스너 중복 초기화 방지
    if (!isEngineInitialized) { initEngine(); setupEventListeners(); setupTouchControls(); }
    selectHotbar(0);
    // 🌟 번들 맵 적용 후 탈출 (맵 안에 파묻히면 블록 위로)
    loadBundledMap().then(() => { liftCharacterOutOfBlocks(); });
    
    // 🌟 루프 중복 차단: 번호 거부 후 재입장해도 animate 2중 실행(이동 2배속) 안 됨
    if (!animate.running) { animate.running = true; animate(); }
    setTimeout(onWindowResize, 100); setTimeout(onWindowResize, 300);
}

const startBtn = document.getElementById('start-btn'), usernameInput = document.getElementById('username-input'), errorMsg = document.getElementById('error-msg');
const accesscodeInput = document.getElementById('accesscode-input'), codeErrorMsg = document.getElementById('code-error-msg');
try {
    const savedCode = localStorage.getItem('ksmsAccessCode');
    if (savedCode && accesscodeInput && !accesscodeInput.value) accesscodeInput.value = savedCode;
} catch (e) {}
usernameInput.addEventListener('input', () => { const v = usernameInput.value.trim(); if (/^[가-힣ㄱ-ㅎㅏ-ㅣa-zA-Z0-9]+$/.test(v)) { errorMsg.classList.add('hidden'); usernameInput.classList.remove('border-rose-500'); } });
accesscodeInput.addEventListener('input', () => { codeErrorMsg.classList.add('hidden'); accesscodeInput.classList.remove('border-rose-500'); });
startBtn.addEventListener('click', tryEnterGame); usernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnterGame(); });
accesscodeInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnterGame(); });

// 🌟 새로고침 재입장: 같은 기기에서 15분 이내에 입장한 적이 있으면 이름 입력 없이 자동 입장
let savedSession = null;
try { savedSession = JSON.parse(localStorage.getItem('ksmsPlayerSession') || 'null'); } catch (e) {}
if (savedSession && savedSession.name) {
    usernameInput.value = savedSession.name;
    if (Date.now() - (savedSession.at || 0) < 15 * 60 * 1000) {
        tryEnterGame();
        usernameInput.blur();
    }
}
</script>
</body>
</html>
